service: __SERVICE_NAME__
image: <%= ENV['IMAGE_REPOSITORY'] %>

servers:
  web:
    hosts:
      - <%= ENV['SERVER_IP'] %>

proxy:
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  hosts:
    - <%= ENV['BRAIN_DOMAIN'] %>
    # <% if ENV['WWW_DOMAIN'] && !ENV['WWW_DOMAIN'].empty? %>
    - <%= ENV['WWW_DOMAIN'] %>
    # <% end %>
    - <%= ENV['PREVIEW_DOMAIN'] %>
  app_port: 8080
  healthcheck:
    path: /health/ready

registry:
  server: ghcr.io
  username: <%= ENV['REGISTRY_USERNAME'] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    NODE_ENV: production
    # <% if ENV['LOCAL_MODELS'] && !ENV['LOCAL_MODELS'].empty? %>
    MODEL_RUNTIME_URL: http://__SERVICE_NAME__-models:11434
    # <% end %>
  secret:
    - AI_API_KEY
    - GIT_SYNC_TOKEN
    - DISCORD_BOT_TOKEN
    - DISCORD_PUBLIC_KEY
    - DISCORD_APPLICATION_ID
    - ATPROTO_APP_PASSWORD
    - SETUP_EMAIL_TO
    - SETUP_EMAIL_API_KEY
    - SETUP_EMAIL_FROM

# <% if ENV['LOCAL_MODELS'] && !ENV['LOCAL_MODELS'].empty? %>
accessories:
  models:
    image: ollama/ollama:0.40.11
    host: <%= ENV['SERVER_IP'] %>
    volumes:
      - /opt/brain-models:/root/.ollama
    options:
      health-cmd: ollama list
      health-interval: 30s
# <% end %>

volumes:
  - /opt/brain-data:/app/brain-data
  - /opt/brain-runtime:/app/data
  - /opt/brain-state:/data
  - /opt/brain-config:/config
  - /opt/brain-dist:/app/dist
  - /opt/brain.yaml:/app/brain.yaml
