name: Upgrade

on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit @rizom/ops version (empty means latest)
        required: false
        type: string
  schedule:
    # Weekday morning check for new operator tooling releases.
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Require upgrade App configuration
        env:
          APP_ID: ${{ vars.OPS_UPGRADE_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "OPS_UPGRADE_APP_ID is not set." >&2
            echo "Configure the upgrade GitHub App as described in docs/operator-playbook.md." >&2
            exit 1
          fi

      - name: Create repository-scoped upgrade token
        id: upgrade-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPS_UPGRADE_APP_ID }}
          private-key: ${{ secrets.OPS_UPGRADE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Checkout deliberately keeps the default read-only Actions token. The
      # upgrade step below installs and executes a freshly published @rizom/ops,
      # and the App token must not sit in .git/config while that code runs.
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install operator tooling
        run: bun install

      - name: Upgrade operator tooling
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: bunx brains-ops upgrade . --to "${VERSION_INPUT:-latest}"

      - name: Open upgrade PR
        env:
          GH_TOKEN: ${{ steps.upgrade-token.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already up to date."
            exit 0
          fi
          VERSION=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).devDependencies["@rizom/ops"])')
          BRANCH="ops/upgrade-rizom-ops-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(ops): upgrade @rizom/ops to $VERSION"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH"
            exit 0
          fi
          gh pr create \
            --title "chore(ops): upgrade @rizom/ops to $VERSION" \
            --body "Automated operator tooling upgrade. Review the scaffold diff, then merge; deploys stay operator-dispatched." \
            --head "$BRANCH"
