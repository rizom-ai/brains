brain: brain
bundleContract: capability-bundles-v1
bundles: [site]
add: [mcp]
remove: [dashboard, analytics]
port: 8085
http:
  enabled: true
database: "file:./brain.db"
embedding:
  enabled: false
site:
  package: "@fixture/reading-site"
plugins:
  onboarding:
    enabled: false
  mcp:
    mode: debug
  directory-sync:
    autoSync: false
    initialSync: false
