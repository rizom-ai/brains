brain: brain
bundleContract: capability-bundles-v1
bundles: [site]
add: [mcp]
port: 8085
remove: [dashboard, analytics]
database: "file:./brain.db"
embedding:
  enabled: false
site:
  package: "@fixture/reading-site"
plugins:
  onboarding:
    enabled: false
  mcp:
    transport: http
    mode: debug
    authToken: ${MCP_AUTH_TOKEN}
  directory-sync:
    autoSync: false
    initialSync: false
