brain: brain
anchor: person
kind: professional
bundles:
  - core
  - media
  - automation
  - web
  - chat
  - site
  - publishing
  - federation
mode: eval

# Composition inheritance and case selection are separate: child suites inherit
# compatible config while selecting only cases explicitly categorized for them.
suites:
  headless:
    bundles:
      - core
    tags:
      - recipe-headless
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/headless
  personal:
    extends: headless
    inheritTags: false
    bundles:
      - core
      - media
      - web
      - chat
    tags:
      - recipe-personal
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/personal
  professional:
    extends: personal
    inheritTags: false
    bundles:
      - core
      - media
      - automation
      - web
      - chat
      - site
      - publishing
      - federation
    tags:
      - recipe-professional
    plugins:
      directory-sync:
        seedContentPath: eval-content/publishing
      site-builder:
        autoRebuild: false
  team:
    extends: personal
    inheritTags: false
    anchor: team
    kind: team
    bundles:
      - core
      - media
      - automation
      - web
      - chat
      - site
      - team
    add:
      - docs
    tags:
      - recipe-team
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/team
      a2a:
        requestTimeoutMs: 1000
        streamIdleTimeoutMs: 1000
        maxNetworkAttempts: 1
      site-builder:
        autoRebuild: false
  commerce:
    extends: headless
    inheritTags: false
    anchor: organization
    kind: organization
    bundles:
      - core
      - media
      - web
      - site
    add:
      - products
    tags:
      - recipe-commerce
    plugins:
      directory-sync:
        seedContentPath: eval-content/commerce
      site-builder:
        autoRebuild: false

models:
  - gpt-5.6-luna
judge: gpt-5.4-mini

keys:
  openai: ${OPENAI_API_KEY}

permissions:
  entityActions:
    post:
      update: trusted
      publish: admin
    social-post:
      update: trusted
      publish: admin
    newsletter:
      update: trusted
      publish: admin

plugins:
  onboarding:
    enabled: true
  # Eval boots in-process without the CLI's supervised Git broker. Seed content
  # is copied into the isolated eval data directory, so Git must stay disabled.
  directory-sync:
    seedContentPath: eval-content/publishing
    strictSeedEntityTypes: true
    autoSync: false
    deleteOnFileRemoval: false
