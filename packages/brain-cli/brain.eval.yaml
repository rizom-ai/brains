brain: brain
bundleContract: capability-bundles-v1
anchor: person
kind: professional
bundles:
  - core
  - media
  - automation
  - web
  - chat
  - site
  - publishing
  - federation
mode: eval

# Composition inheritance and case selection are separate: child suites inherit
# compatible config while selecting only cases explicitly categorized for them.
suites:
  headless:
    bundles:
      - core
    tags:
      - recipe-headless
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/headless
  personal:
    extends: headless
    inheritTags: false
    bundles:
      - core
      - media
      - web
      - chat
    tags:
      - recipe-personal
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/personal
  professional:
    extends: personal
    inheritTags: false
    bundles:
      - core
      - media
      - automation
      - web
      - chat
      - site
      - publishing
      - federation
    tags:
      - recipe-professional
    plugins:
      directory-sync:
        seedContentPath: eval-content/publishing
      site-builder:
        autoRebuild: false
  # Professional plus the optional Buttondown and stock-photo providers, to
  # prove their conditional tool exposure. The keys are placeholders: provider
  # calls fail, so cases assert routing and refusal to invent results.
  providers:
    extends: professional
    inheritTags: false
    tags:
      - recipe-providers
    plugins:
      newsletter:
        provider:
          type: buttondown
          apiKey: eval-placeholder-buttondown-key
      stock-photo:
        apiKey: eval-placeholder-stock-photo-key
  team:
    extends: personal
    inheritTags: false
    anchor: team
    kind: team
    bundles:
      - core
      - media
      - automation
      - web
      - chat
      - site
      - team
    add:
      - docs
      - action-board
    tags:
      - recipe-team
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/team
      a2a:
        requestTimeoutMs: 1000
        streamIdleTimeoutMs: 1000
        maxNetworkAttempts: 1
      site-builder:
        autoRebuild: false
  # The doc-brain at docs.rizom.ai: reference docs and moving-in guides on
  # the docs site, so answers cite each at its page.
  # Its seeded docs and guides are what the docs sync writes for them:
  # `bun run docs:seed` rewrites them, and `bun run docs:seed:check` (part of
  # docs:check) fails when they drift from their sources.
  docs:
    extends: headless
    inheritTags: false
    bundles:
      - core
      - web
      - chat
      - site
      - publishing
    add:
      - docs
      - guides
    remove:
      - series
      - portfolio
      - content-pipeline
      - social-media
      - newsletter
      - stock-photo
    site:
      package: "@rizom/site-docs"
    domain: docs.rizom.ai
    tags:
      - recipe-docs
    plugins:
      directory-sync:
        seedContentPath: eval-content/recipes/docs
      site-builder:
        autoRebuild: false
models:
  - gpt-6-luna
judge: gpt-5.4-mini

keys:
  openai: ${OPENAI_API_KEY}

permissions:
  entityActions:
    post:
      update: trusted
      publish: admin
    social-post:
      update: trusted
      publish: admin
    newsletter:
      update: trusted
      publish: admin

plugins:
  onboarding:
    enabled: true
  # Eval boots in-process without the CLI's supervised Git broker. Seed content
  # is copied into the isolated eval data directory, so Git must stay disabled.
  directory-sync:
    seedContentPath: eval-content/publishing
    strictSeedEntityTypes: true
    autoSync: false
    deleteOnFileRemoval: false
