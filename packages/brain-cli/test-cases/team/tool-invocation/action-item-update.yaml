id: team-tool-action-item-update
name: Move an action item and note why
description: Tests that moving an action item and adding a note goes through action_item_update, which records the change under the caller, rather than system_update.
type: tool_invocation
setup:
  permissionLevel: trusted
tags:
  - recipe-team
  - team
  - action-board

turns:
  - userMessage: >-
      Mark the action item "Audit eval-content for stale generic fixtures" as
      blocked, with a note that we are waiting on the fixture owners.

successCriteria:
  expectedTools:
    - toolName: action_item_update
      shouldBeCalled: true
      argsContain:
        status: blocked
      # The card is named by its title or its id; the one moved is the check.
      resultContains:
        id: audit-stale-fixtures
        status: blocked
    - toolName: system_update
      shouldBeCalled: false
  responseNotContains:
    - "I cannot"
    - "permission denied"
  responseCriteria:
    - "Reports the card as blocked, with the note about waiting on the fixture owners."

efficiency:
  maxToolCalls: 4
  maxTokens: 35000
