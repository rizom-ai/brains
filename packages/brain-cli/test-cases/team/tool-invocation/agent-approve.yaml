id: team-tool-agent-approve
name: Approve discovered Team Brain peer brain
description: Tests that a discovered peer brain is approved through system_update.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-team
  - team
  - agent-discovery
  - a2a
  - core

turns:
  - userMessage: "Approve old-agent.example for Team Brain peer-brain coordination."

successCriteria:
  expectedTools:
    - toolName: agent_set_standing
      shouldBeCalled: true
      argsContain:
        agent: "old-agent.example"
        contact: "approved"
  responseNotContains:
    - "I cannot"
    - "not approved yet"

efficiency:
  maxToolCalls: 4
  maxTokens: 23000
