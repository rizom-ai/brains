id: team-tool-create-note
name: Team Brain note capture via system_create
description: Verifies that Team Brain captures team notes through the shared system_create surface.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - posture-team
  - team
  - core
  - system
  - entity-crud

turns:
  - userMessage: "Save this team note: We decided to keep Team Brain focused on team memory, peer coordination, and shared synthesis."

successCriteria:
  expectedTools:
    - toolName: system_create
      shouldBeCalled: true
      argsContain:
        entityType: "note"
        visibility: shared
  responseNotContains:
    - "I cannot"
    - "note_create"
  minAccuracyScore: 3

efficiency:
  maxToolCalls: 3
  maxTokens: 20000
