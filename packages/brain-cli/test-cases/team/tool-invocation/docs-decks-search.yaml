id: team-tool-docs-decks-search
name: Search Team Brain docs and decks
description: Tests that the agent searches existing docs/decks content when asked to synthesize the Team Brain operating model.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - posture-team
  - team
  - docs
  - decks
  - full
  - search

turns:
  - userMessage: "Use the current Team Brain docs and deck content to explain the Team Brain operating model and POC walkthrough."

successCriteria:
  toolCountRange:
    min: 1
    max: 6
  responseContains:
    - "Team Brain"
  responseNotContains:
    - "meeting-notes"
    - "decision-record"
    - "newsletter"
    - "blog"

  minHelpfulnessScore: 3
  minAccuracyScore: 3
  minInstructionFollowingScore: 3

efficiency:
  maxToolCalls: 6
  maxTokens: 30000
