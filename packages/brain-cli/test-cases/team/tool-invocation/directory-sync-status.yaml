id: team-tool-directory-sync-status
name: Team Brain directory sync and git status
description: >-
  Verifies that Team Brain answers operator sync-status questions through the
  directory_sync status action instead of performing a sync or inventing git state.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-team
  - team
  - directory-sync
  - git
  - core
  - operator

turns:
  - userMessage: >-
      Check Team Brain's content filesystem sync and git status. Do not start a sync
      or backup; just report the current status and any pending changes.

successCriteria:
  expectedTools:
    - toolName: directory_sync
      shouldBeCalled: true
      argsContain:
        action: status
    - toolName: directory_sync
      shouldBeCalled: false
      argsContain:
        action: sync
  responseContains:
    - "sync"
  responseNotContains:
    - "started a sync"
    - "backup complete"
    - "I cannot"
    - "I don't have access"
  minInstructionFollowingScore: 4

efficiency:
  maxToolCalls: 3
  maxTokens: 20000
