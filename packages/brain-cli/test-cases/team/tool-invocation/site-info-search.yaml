id: team-tool-site-info-search
name: Search Team Brain site info and site content
description: Tests that the agent can answer questions about the existing minimal Team Brain public site content.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-team
  - team
  - site-content
  - site-info
  - default
  - search

turns:
  - userMessage: "What does the current Team Brain public site say about Team Brain's purpose and principles? Search the saved site-info and site-content first."

successCriteria:
  toolCountRange:
    min: 1
    max: 6
  responseContains:
    - "Team Brain"
    - "captur"
  responseNotContains:
    - "newsletter"
    - "publishing pipeline"
    - "meeting-notes"
    - "decision-record"

  minHelpfulnessScore: 3
  minInstructionFollowingScore: 3

efficiency:
  maxToolCalls: 6
  maxTokens: 30000
