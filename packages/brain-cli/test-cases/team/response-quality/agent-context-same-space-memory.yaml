id: team-agent-context-same-space-memory
name: Team Brain uses same-space conversation memory without a tool call
description: >-
  Verifies Team Brain's installed conversation-memory provider injects same-space
  summary context into the agent turn, so a trusted teammate can ask a natural
  follow-up in the same channel.
type: response_quality
setup:
  permissionLevel: trusted
  interfaceType: discord
  channelId: team-poc
  channelName: team-poc
tags:
  - recipe-team
  - team
  - conversation-memory
  - agent-context
  - same-space

turns:
  - userMessage: >-
      In this channel, the in-turn memory includes a Team Brain preset direction
      summary. Remind me what it says about core, default, and full. Use the
      conversation memory already available in this turn; do not call tools.

successCriteria:
  expectedTools:
    - toolName: system_search
      shouldBeCalled: false
    - toolName: system_get
      shouldBeCalled: false
    - toolName: system_list
      shouldBeCalled: false
  responseContains:
    - "core"
    - "default"
    - "full"
  responseNotContains:
    - "I don't have access"
    - "I don't have"
    - "blog"
    - "newsletter"
  # The holistic accuracy score failed a reply that stated all three, once
  # in three samples; the requirement is checked as stated instead.
  responseCriteria:
    - "States that core validates private team memory and coordination, default adds a minimal public site, and full only adds existing team-knowledge surfaces."
  minHelpfulnessScore: 4
  minInstructionFollowingScore: 4

efficiency:
  maxToolCalls: 0
  maxTokens: 23000
