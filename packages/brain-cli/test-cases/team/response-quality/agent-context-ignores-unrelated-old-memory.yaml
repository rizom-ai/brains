id: team-agent-context-ignores-unrelated-old-memory
name: Team Brain does not rely on unrelated old conversation memory
description: >-
  Exercises full agent behavior with an unrelated older same-space summary in
  the fixture set. The response should answer from relevant Team Brain memory and not
  surface unrelated stale markers.
type: response_quality
setup:
  permissionLevel: trusted
  interfaceType: discord
  channelId: team-poc
  channelName: team-poc
tags:
  - recipe-team
  - team
  - conversation-memory
  - agent-context
  - relevance

turns:
  - userMessage: >-
      Using only the conversation memory already available in this turn, remind
      me what Team Brain's preset direction says about core, default, and full. Do
      not call tools.

successCriteria:
  expectedTools:
    - toolName: system_search
      shouldBeCalled: false
    - toolName: system_get
      shouldBeCalled: false
    - toolName: system_list
      shouldBeCalled: false
  responseContains:
    - "Core"
    - "private team memory"
    - "Default"
    - "minimal public site"
    - "Full"
    - "existing team-knowledge"
  responseNotContains:
    - "Neptune waiver"
    - "tangerine kiosk"
    - "facilities"
    - "I don't have access"
  minHelpfulnessScore: 4
  minAccuracyScore: 4
  minInstructionFollowingScore: 4

efficiency:
  maxToolCalls: 0
  maxTokens: 30000
