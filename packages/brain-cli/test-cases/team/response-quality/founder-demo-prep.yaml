id: team-scenario-founder-demo-prep
name: Founder demo prep from current Team Brain memory
description: >-
  Real user scenario: a founder needs a grounded demo talk track for a skeptical
  technical buyer, including current capabilities and remaining proof.
type: response_quality
setup:
  permissionLevel: admin
tags:
  - recipe-team
  - team
  - scenario
  - real-user
  - demo
  - search
  - full

turns:
  - userMessage: >-
      We have a Team Brain demo in 20 minutes for a skeptical CTO. Search current
      Team Brain memory and give me a talk track: what works today, why it matters,
      what gaps remain, and what proof we should run next.

successCriteria:
  expectedTools:
    - toolName: system_search
      shouldBeCalled: true
  responseNotContains:
    - "blog platform"
    - "newsletter"
  minHelpfulnessScore: 4
  minAccuracyScore: 4
  minInstructionFollowingScore: 4
  responseCriteria:
    - "Describes what works today from saved memory, such as capture, summaries, topics, and peer-brain coordination."
    - "Names the gaps that remain."
    - "Proposes concrete proof to run next."

efficiency:
  maxToolCalls: 10
  maxTokens: 40000
