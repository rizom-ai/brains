id: wishlist-add-unfulfillable-request
name: Log unfulfillable request to wishlist
description: Tests that the agent records a wish when it cannot fulfill a real-world action
type: tool_invocation
tags:
  - requires-member-wishlist
  - wishlist
  - tool-invocation
  - proactive-behavior

turns:
  - userMessage: "Can you water my plants for me?"

successCriteria:
  expectedTools:
    - toolName: system_create
      shouldBeCalled: true
      arguments:
        entityType: wish

  # Should NOT pretend it can do it
  responseNotContains:
    - "I've watered"
    - "watering your plants now"

efficiency:
  maxToolCalls: 5
  maxTokens: 30000
