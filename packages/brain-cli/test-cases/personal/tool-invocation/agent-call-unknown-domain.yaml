id: tool-invocation-agent-call-unknown-domain
name: Verify or Refuse Unknown Agent by Domain
description: Tests that an unknown exact-domain agent request uses agent_call, does not create/connect a new agent, and reports verification/contact failure when no Agent Card can be verified.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-network
  - agent-discovery
  - a2a
  - tool-invocation
  - bundle-core

turns:
  - userMessage: "Ask unknown-agent.example about ecosystem architecture"

successCriteria:
  expectedTools:
    - toolName: agent_call
      shouldBeCalled: true
      argsContain:
        agent: "unknown-agent.example"
    - toolName: agent_connect
      shouldBeCalled: false
  responseNotContains:
    - "I called"
    - "I reached"
  responseCriteria:
    - "Says it could not verify or contact unknown-agent.example, and does not claim to have asked it."

efficiency:
  maxToolCalls: 3
  maxTokens: 25000
