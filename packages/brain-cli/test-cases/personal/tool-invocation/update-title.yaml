id: tool-invocation-update-title
name: Update Entity Title
description: Tests permission-aware system_update behavior for changing a title
type: tool_invocation
setup:
  interfaceType: evaluation
tags:
  - core
  - system
  - entity-crud
  - permissions
  - recipe-professional

turns:
  - userMessage: "Change the title of my note 'typescript-patterns' to 'TypeScript Pattern Notes'"

successCriteria: {}

permissions:
  public:
    expectedTools:
      - toolName: system_update
        shouldBeCalled: false
    responseCriteria:
      - "Does not claim the request is done."
  trusted:
    expectedTools:
      - toolName: system_update
        shouldBeCalled: true
    responseCriteria:
      - "Does not claim the request is done."
  admin:
    expectedTools:
      - toolName: system_update
        shouldBeCalled: true
    responseNotContains:
      - "I cannot"
      - "I don't have access"

efficiency:
  maxToolCalls: 5
  maxTokens: 40000
