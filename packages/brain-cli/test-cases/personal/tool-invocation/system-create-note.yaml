id: tool-invocation-system-create-note
name: Direct Note Creation via system_create
description: >-
  Verifies permission-aware note creation: Public is refused, while Trusted
  and Admin call system_create, which asks for approval before it saves.
type: tool_invocation
setup:
  interfaceType: evaluation
tags:
  - recipe-team
  - core
  - system
  - entity-crud
  - permissions
  - bundle-core

turns:
  - userMessage: "Save this as a note: Core permission matrix note."

successCriteria: {}

permissions:
  public:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: false
    responseNotContains:
      - "Confirmation required"
      - "I've saved"
      - "I saved"
      - "saved it"
      - "successfully saved"
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."
  trusted:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: true
        resultRefused: false
        argsContain:
          entityType: note
          source.kind: user-message
    # No "Confirmation required" here: system_create always asks for approval
    # first, so a trusted caller reaching that prompt is correct behaviour. What
    # must not appear is a claim the note was already saved.
    responseNotContains:
      - "I've saved"
      - "I saved"
      - "saved it"
      - "successfully saved"
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."
  admin:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: true
        resultRefused: false
        argsContain:
          entityType: note
          source.kind: user-message
        argsAbsent:
          - upload
          - sourceAttachment
          - from
    toolCountRange:
      min: 1
    # As for Trusted, reaching the approval prompt is correct; what must not
    # appear is a claim the note was already saved.
    responseNotContains:
      - "I cannot"
      - "note_create"
      - "I've saved"
      - "I saved"
      - "saved it"
      - "successfully saved"
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."

efficiency:
  maxToolCalls: 6
  # The Trusted and Admin prompts carry system_create's and system_update's
  # typed field-change lists (2026-11-09), which the 2026-10-09 baseline
  # predates: 5,956 input tokens on a team brain. Highest of five
  # samples on 2026-11-18 was 17,321 (Admin), plus 25%, rounded up to 1,000.
  maxTokens: 22000
