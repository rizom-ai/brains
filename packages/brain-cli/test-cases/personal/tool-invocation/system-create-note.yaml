id: tool-invocation-system-create-note
name: Direct Note Creation via system_create
description: Verifies permission-aware behavior for direct note creation
type: tool_invocation
setup:
  interfaceType: evaluation
tags:
  - recipe-team
  - core
  - system
  - entity-crud
  - permissions
  - bundle-core

turns:
  - userMessage: "Save this as a note: Core permission matrix note."

successCriteria: {}

permissions:
  public:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: false
    responseNotContains:
      - "Confirmation required"
      - "I've saved"
      - "I saved"
      - "saved it"
      - "successfully saved"
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."
  trusted:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: true
        resultRefused: false
        argsContain:
          entityType: note
          source.kind: user-message
    # No "Confirmation required" here: system_create always asks for approval
    # first, so a trusted caller reaching that prompt is correct behaviour. What
    # must not appear is a claim the note was already saved.
    responseNotContains:
      - "I've saved"
      - "I saved"
      - "saved it"
      - "successfully saved"
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."
  admin:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: true
        resultRefused: false
        argsContain:
          entityType: note
          source.kind: user-message
        argsAbsent:
          - upload
          - sourceAttachment
          - from
    toolCountRange:
      min: 1
    responseNotContains:
      - "I cannot"
      - "note_create"
    minAccuracyScore: 3

efficiency:
  maxToolCalls: 6
  maxTokens: 25000
