id: tool-invocation-agent-add-explicit-save-no-approval-gate
name: Explicit Agent Save Does Not Require Separate Approval
description: Tests that an explicit agent-save request connects the agent at once, without asking for a description or telling the user a separate approval step is still needed
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-network
  - agent-discovery
  - a2a
  - tool-invocation
  - regression
  - bundle-core

turns:
  - userMessage: "Save mylittlephoney.com as an agent in my directory"

successCriteria:
  expectedTools:
    - toolName: agent_connect
      shouldBeCalled: true
      argsContain:
        source.kind: "url"
        source.url: "mylittlephoney.com"
  responseNotContains:
    - "approve it first"
    - "not approved yet"
    - "Once it’s ready and approved"
    - "Once it's ready and approved"
    - "discovered rather than approved"
    - "No URL or domain provided"
    - "needs either content or a prompt"
    - "short description"
    - "what this agent is for"

efficiency:
  maxToolCalls: 3
  maxTokens: 25000
