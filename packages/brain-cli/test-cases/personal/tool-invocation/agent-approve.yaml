id: tool-invocation-agent-approve
name: Approve Discovered Agent
description: Tests permission-aware approval of a discovered contact through agent_set_standing and its confirmation flow.
type: tool_invocation
setup:
  interfaceType: evaluation
tags:
  - agent-discovery
  - a2a
  - tool-invocation
  - permissions
  - regression
  - recipe-professional

turns:
  - userMessage: "Approve approval-candidate.example"

successCriteria: {}

permissions:
  public:
    expectedTools:
      - toolName: agent_set_standing
        shouldBeCalled: false
      - toolName: system_update
        shouldBeCalled: false
    responseNotContains:
      - "status set to approved"
  trusted:
    expectedTools:
      # Setting a contact's standing is an admin's tool, so a trusted caller
      # has nothing to call.
      - toolName: agent_set_standing
        shouldBeCalled: false
      - toolName: agent_connect
        shouldBeCalled: false
    responseNotContains:
      - "status set to approved"
    responseCriteria:
      - "Explains that approving the agent needs a higher permission level, and does not change it."
  admin:
    expectedTools:
      - toolName: agent_set_standing
        shouldBeCalled: true
        argsContain:
          agent: "approval-candidate.example"
          contact: "approved"
      - toolName: system_update
        shouldBeCalled: false
    responseContains:
      - "Confirmation required"
    responseNotContains:
      - "Approved"
      - "field-based update rather than content replacement"
      - "It’s still not approved yet"
      - "It's still not approved yet"

efficiency:
  maxToolCalls: 6
  # Trusted is refused by system_update and then answers: two model steps,
  # each carrying the typed field-change lists (2026-11-09) that the
  # 2026-10-09 baseline predates. Highest of five samples on 2026-11-18 was
  # 33,669 (Trusted), plus 25%, rounded up to 1,000.
  maxTokens: 43000
