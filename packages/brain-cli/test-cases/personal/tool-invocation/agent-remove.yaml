id: tool-invocation-agent-remove
name: Archive Agent from Directory
description: Tests that the agent archives a contact through agent_set_standing
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-professional
  - agent-discovery
  - tool-invocation
  - bundle-core

turns:
  - userMessage: "Archive old-agent.example from my contacts"

successCriteria:
  expectedTools:
    - toolName: agent_set_standing
      shouldBeCalled: true
      argsContain:
        agent: "old-agent.example"
        contact: "archived"
  responseNotContains:
    - "I cannot"
    - "I don't have access"

efficiency:
  maxToolCalls: 3
  maxTokens: 36900