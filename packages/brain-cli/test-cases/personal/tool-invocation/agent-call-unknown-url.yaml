id: tool-invocation-agent-call-unknown-url
name: Call Unknown Agent by HTTPS URL
description: Tests that an HTTPS agent URL can be canonicalized to its hostname for agent_call, with runtime verification/contact over HTTPS and no auto-save.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - requires-external-network
  - agent-discovery
  - a2a
  - tool-invocation
  - bundle-core

turns:
  - userMessage: "Ask https://unknown-agent.io about ecosystem architecture"

successCriteria:
  expectedTools:
    - toolName: agent_call
      shouldBeCalled: true
      argsContain:
        agent: unknown-agent.io
      argsAbsent:
        - confirmed
        - confirmationToken
    - toolName: agent_connect
      shouldBeCalled: false
    - toolName: system_create
      shouldBeCalled: false
  responseContainsAny:
    - ["unknown-agent.io"]
  responseNotContains:
    - "I called"
    - "I reached out"
    - "I've saved"
    - "I saved"
    - "saved it"
    - "successfully saved"
  responseCriteria:
    - "Says it could not verify or contact the agent at that URL, and does not claim to have asked it."
    - "Does not claim that anything was connected."

efficiency:
  maxToolCalls: 3
  maxTokens: 25000
