id: tool-invocation-agent-scan-directories
name: Scan Agent Directories
summary: Verifies explicit agent network refresh requests use the directory scan tool.
description: When an operator asks to refresh second-order agent discovery now, Brain should call agent_scan_directories instead of only describing the daily recurring scan.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - requires-external-network
  - agent-discovery
  - a2a
  - tool-invocation
  - bundle-core

turns:
  - userMessage: "Refresh the agent network now by scanning approved peers' public directories."

successCriteria:
  expectedTools:
    - toolName: agent_scan_directories
      shouldBeCalled: true
  responseNotContains:
    - "I cannot"
    - "I don't have access"
    - "daily scan will"

efficiency:
  maxToolCalls: 2
  maxTokens: 25000
