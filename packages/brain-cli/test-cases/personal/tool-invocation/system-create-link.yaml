id: tool-invocation-system-create-link
name: Link Save via system_create
description: Verifies permission-aware behavior for saving a link
type: tool_invocation
setup:
  interfaceType: evaluation
tags:
  - requires-external-network
  - core
  - system
  - link
  - entity-crud
  - permissions
  - bundle-core

turns:
  - userMessage: "Save this link for me: https://anthropic.com/research"

successCriteria: {}

permissions:
  public:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: false
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."
  trusted:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: true
        resultRefused: false
        argsContain:
          entityType: "link"
          source.kind: "url"
          source.url: "https://anthropic.com/research"
    responseCriteria:
      - "Does not claim that anything was created, or that the request is done."
  admin:
    expectedTools:
      - toolName: system_create
        shouldBeCalled: true
        resultRefused: false
        argsContain:
          entityType: "link"
          source.kind: "url"
          source.url: "https://anthropic.com/research"
    responseNotContains:
      - "I cannot"
      - "I don't have access"
      - "I'm unable"
      - "link_capture"
    minAccuracyScore: 3

efficiency:
  maxToolCalls: 5
  maxTokens: 25000
