id: tool-invocation-playbook-status
name: Playbook Status Check
description: Verifies that explicit playbook status requests use playbooks_manage action=status.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - playbooks
  - tool-invocation
  - recipe-professional

turns:
  - userMessage: "Check the status of the onboarding playbook."

successCriteria:
  expectedTools:
    - toolName: playbooks_manage
      shouldBeCalled: true
      argsContain:
        action: status
        playbookId: onboarding
  responseNotContains:
    - "I cannot"
    - "I don't have access"

efficiency:
  maxToolCalls: 2
  maxTokens: 15500
