id: tool-invocation-blog-note-to-post-generate
name: New Post Written From a Note Uses Generation
description: Verifies that asking for a new post written from a note generates it from the note, while turning the note into a post keeps its text.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - blog
  - generation
  - regression
  - recipe-professional

turns:
  - userMessage: "Write a new blog post that expands on my note Green Software Engineering Principles."

successCriteria:
  expectedTools:
    - toolName: system_generate
      shouldBeCalled: true
      argsContain:
        operation.kind: prompt-from-source
        operation.entityType: post
        operation.source.entityType: note
    - toolName: system_create
      shouldBeCalled: false
  toolCountRange:
    min: 1
  responseNotContains:
    - "I cannot"
    - "I don't have access"

efficiency:
  maxToolCalls: 4
  maxTokens: 40000
