id: response-quality-search-with-results
name: Search With Results
description: Tests that the agent searches for content and references actual results in its response
type: response_quality
setup:
  permissionLevel: admin
tags:
  - core
  - search
  - content-dependent
  - recipe-professional

turns:
  - userMessage: "What have I written about distributed systems?"

successCriteria:
  expectedTools:
    - toolName: system_search
      shouldBeCalled: true
  responseNotContains:
    - "I cannot"
    - "I don't have access"
    - "no results"
    - "nothing found"
    # It searches on its own rather than offering to.
    - "would you like me to search"
    - "Would you like me to search"
    - "shall I search"
    - "want me to search"
  minHelpfulnessScore: 4
  minAccuracyScore: 4

efficiency:
  maxToolCalls: 8
  maxTokens: 36000
