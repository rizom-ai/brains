id: multi-turn-agent-approve-then-call-now
name: Approve Then Call Uses Approved Status Immediately
description: >-
  Verifies that approving a saved agent (archived in the network seed) goes
  through confirmation and is stored, so an immediate follow-up call sees the
  approved status and proceeds to agent_call.
type: multi_turn
setup:
  permissionLevel: admin
tags:
  - recipe-network
  - agent-discovery
  - a2a
  - multi-turn
  - regression
  - bundle-core

turns:
  - userMessage: "Approve old-agent.example"
    successCriteria:
      expectedTools:
        - toolName: agent_set_standing
          shouldBeCalled: true
          argsContain:
            agent: "old-agent.example"
            contact: "approved"
      responseContains:
        - "Confirmation required"
      responseNotContains:
        - "Approved"
        - "not approved yet"
        - "approve it first"
        - "still not approved"

  - userMessage: "Approve confirmation"
    confirmPendingAction: true
    successCriteria:
      responseContains:
        - "Completed: Approve contacting old-agent.example"

  - userMessage: "Can you talk to old-agent.example now?"
    successCriteria:
      expectedTools:
        - toolName: agent_call
          shouldBeCalled: true
          argsContain:
            agent: "old-agent.example"
      responseNotContains:
        - "not approved yet"
        - "approve it first"
        - "still not approved"
        - "discovered but not approved yet"

successCriteria: {}

efficiency:
  maxToolCalls: 5
  # Approve, confirm and call are three model turns, each carrying the typed
  # field-change lists (2026-11-09) that the 2026-10-09 budget predates; the
  # call reaches the agent only since an approval is stored. Highest of five
  # samples on 2026-11-18 was 55,365, plus 25%, rounded up to 1,000.
  maxTokens: 70000
