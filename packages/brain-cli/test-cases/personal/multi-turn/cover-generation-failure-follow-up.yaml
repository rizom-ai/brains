id: cover-generation-failure-follow-up
name: Cover generation failure follow-up reports failure, not pending status
description: Verifies that after a cover-image request fails because the target post cannot be found, a follow-up like "is it ready?" does not imply the job is still pending
type: multi_turn
setup:
  permissionLevel: admin
tags:
  - image
  - cover
  - multi-turn
  - failure-handling
  - recipe-professional

turns:
  - userMessage: "Generate a cover image for the blog post 'missing-cover-target-9f3c'"
    successCriteria:
      responseCriteria:
        - "Reports that the target post could not be found and that no cover image generation started."
  - userMessage: "is it ready?"
    successCriteria:
      # The request failed: asking after it is no request to try again. How
      # the reply confirms there is nothing to wait for is the model's own.
      expectedTools:
        - toolName: system_generate
          shouldBeCalled: false
      responseCriteria:
        - "Explains that the cover image was never started because the target post was not found, and does not suggest it is still in progress."

successCriteria:
  expectedTools:
    - toolName: system_generate
      shouldBeCalled: true
      argsContain:
        operation.target.entityId: "missing-cover-target-9f3c"

efficiency:
  maxToolCalls: 4
  maxTokens: 66000
