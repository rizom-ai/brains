id: multi-turn-web-chat-image-upload-bare-label-follow-up
name: Web chat image upload bare label follow-up stays inert
description: Verifies a short label-only follow-up after a bare image upload asks for clarification instead of generating or saving a new image entity.
type: multi_turn
setup:
  permissionLevel: admin
  interfaceType: web-chat
  channelId: eval-web-chat-file-upload
  channelName: Web Chat Eval
tags:
  - recipe-personal
  - web-chat
  - upload
  - image
  - regression
  - multi-turn
  - bundle-core

turns:
  - userMessage: ""
    attachments:
      - kind: file
        filename: drunken-robot.png
        mediaType: image/png
        dataBase64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII=
    successCriteria:
      responseContains:
        - "drunken-robot.png"
        - "What would you like me to do"
      toolCountRange:
        max: 0

  # A bare label asks what to do: looking it up first is fine, saving is not.
  - userMessage: "drunken"
    successCriteria:
      responseNotContains:
        - "generating"
        - "I created"
        - "I generated"
      responseCriteria:
        - "Does not claim that anything was created or saved."

successCriteria:
  expectedTools:
    - toolName: system_create
      shouldBeCalled: false
    - toolName: system_update
      shouldBeCalled: false
    - toolName: system_delete
      shouldBeCalled: false
    - toolName: system_generate
      shouldBeCalled: false
  responseNotContains:
    - "generating"
    - "I created"
    - "I generated"
  responseCriteria:
    - "Does not claim that anything was created or saved."

efficiency:
  maxToolCalls: 2
  maxTokens: 34300