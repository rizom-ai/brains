id: multi-turn-web-chat-multi-pdf-upload-notes
name: Web chat keeps several uploaded PDFs and a Markdown file as notes under one confirmation
description: Verifies that keeping several PDFs and a Markdown file attached to one message as notes is one system_create call listing every file, with each PDF's text extracted into a note rather than kept as a document, and that one confirmation saves every file as a note.
type: multi_turn
setup:
  permissionLevel: admin
  interfaceType: web-chat
  channelId: eval-web-chat-multi-pdf-upload-notes
  channelName: Web Chat Eval
tags:
  - recipe-personal
  - web-chat
  - upload
  - pdf
  - note
  - multi-turn

turns:
  - userMessage: "Keep these as notes."
    attachments:
      - kind: file
        filename: tidal-energy.pdf
        mediaType: application/pdf
        dataBase64: 
        source:
          kind: upload
          id: upload-00000000-0000-4000-8000-000000001331
      - kind: file
        filename: coastal-erosion.pdf
        mediaType: application/pdf
        dataBase64: 
        source:
          kind: upload
          id: upload-00000000-0000-4000-8000-000000001332
      - kind: text
        filename: survey-plan.md
        mediaType: text/markdown
        content: |
          # Survey Plan

          The next survey covers the northern dunes.
        source:
          kind: upload
          id: upload-00000000-0000-4000-8000-000000001333
    successCriteria:
      expectedTools:
        - toolName: system_create
          shouldBeCalled: true
          argsContain:
            entityType: note
            source.kind: uploads
          argsAbsent:
            - title
      toolCountRange:
        max: 1
      responseContains:
        - "Confirmation required"
      responseNotContains:
        - "document"

  - userMessage: "yes"
    confirmPendingAction: true
    successCriteria:
      responseContains:
        - "Completed: Saved 3 uploaded files"
        - 'note "tidal-energy"'
        - 'note "coastal-erosion"'
        - 'note "Survey Plan"'
      responseNotContains:
        - 'document "'
        - "draft is generating"

successCriteria:
  expectedTools:
    - toolName: system_create
      shouldBeCalled: true
      argsContain:
        entityType: note
        source.kind: uploads
    - toolName: system_generate
      shouldBeCalled: false

efficiency:
  maxToolCalls: 2
  maxTokens: 25000
