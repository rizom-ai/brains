      expectedTools:
        - toolName: system_update
          argsContain:
            entityType: note
            id: mcp-verbatim-update
            operation.kind: source
            operation.source.kind: user-message
            operation.source.boundaryMode: lines
            operation.source.startAfter: BEGIN EXACT CONTENT
            operation.source.endBefore: END EXACT CONTENT
