id: multi-turn-playbook-blocks-early-next
name: Playbook Blocks Early Next Without Identity Details
description: Verifies that Brain does not advance from Brain identity on a generic Next/continue request before brain identity is saved.
type: multi_turn
setup:
  permissionLevel: admin
  interfaceType: web-chat
  channelId: web-chat-eval-playbook-gate
  channelName: Web Chat Eval
tags:
  - recipe-professional
  - onboarding
  - playbooks
  - multi-turn
  - bundle-core

turns:
  - userMessage: "Start playbook onboarding."
    successCriteria:
      expectedTools:
        - toolName: playbook_manage
          shouldBeCalled: true
          argsContain:
            action: start
            playbookId: onboarding
      responseContains:
        - Brain
      responseNotContains:
        - "I cannot"
        - "I don't have access"

  - userMessage: "Next. I have not provided brain identity details yet."
    successCriteria:
      expectedTools:
        - toolName: system_create
          shouldBeCalled: false
        - toolName: system_update
          shouldBeCalled: false
        - toolName: playbook_manage
          shouldBeCalled: false
          argsContain:
            action: send-event
      responseNotContains:
        - "What should I call you"
        - "what should I call you"
        - "Confirmation required"
        - "I cannot"
        - "I don't have access"

successCriteria:
  expectedTools:
    - toolName: playbook_manage
      shouldBeCalled: true
  toolCountRange:
    max: 5
  responseNotContains:
    - "Confirmation required"
    - "I cannot"
    - "I don't have access"

efficiency:
  maxToolCalls: 5
  maxTokens: 120000
