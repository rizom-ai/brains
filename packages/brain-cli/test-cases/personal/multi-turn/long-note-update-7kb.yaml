# Synthetic fixtures; never run this case against production content.
# Per-turn durations and tokens are reported separately from correctness.
id: long-note-update-7kb
name: Exact small edit to a 7kb note
description: Cancel an exact proposal and verify unchanged stored content, then propose again, approve, and verify exact stored Markdown. Backslashes must not be regenerated or doubled.
type: multi_turn
setup:
  permissionLevel: admin
  interfaceType: mcp
tags:
  - recipe-personal
  - regression
  - long-note-update
  - confirmation
turns:
  - userMessage: 'Read note ''long-note-update-7kb''. Replace only the exact sentence "Review cadence: monthly." with "Review cadence: weekly." Preserve every other character, including backslashes and line endings. Request confirmation before saving; do not merely describe the edit.'
    successCriteria: &proposal
      expectedTools:
        - toolName: system_update
          argsContain:
            entityType: note
            id: long-note-update-7kb
          argsAbsent:
            [
              "operation.fields",
              "operation.content",
              "confirmed",
              operation.source,
            ]
          resultContains:
            needsConfirmation: true
      responseContains: [Confirmation required]
  - userMessage: Cancel that proposed update.
    confirmPendingAction: false
  - userMessage: "Read note 'long-note-update-7kb' from storage now. Do not change anything; briefly state its title and review cadence."
    successCriteria:
      expectedTools:
        - toolName: system_get
          argsContain:
            entityType: note
            id: long-note-update-7kb
          resultContains:
            # The stored record, whichever part the model reads: the hash of
            # the whole document, frontmatter included.
            entity.contentHash: 0affa83c2e0d0aa9bce8e041aaee9f7a1fb1e44cbc06c4ba4b3d6497588561ab
        - toolName: system_update
          shouldBeCalled: false
  - userMessage: 'Read note ''long-note-update-7kb''. Replace only the exact sentence "Review cadence: monthly." with "Review cadence: weekly." Preserve every other character, including backslashes and line endings. Request confirmation before saving; do not merely describe the edit.'
    successCriteria: *proposal
  - userMessage: Approve this exact proposed update.
    confirmPendingAction: true
    successCriteria:
      expectedTools:
        - toolName: system_update
          argsContain:
            entityType: note
            id: long-note-update-7kb
          argsAbsent:
            ["operation.fields", "operation.content", operation.source]
          resultContains:
            updated: long-note-update-7kb
  - userMessage: "Read note 'long-note-update-7kb' from storage again to verify the saved edit. Do not change anything; briefly state its title and review cadence."
    successCriteria:
      expectedTools:
        - toolName: system_get
          argsContain:
            entityType: note
            id: long-note-update-7kb
          resultContains:
            # The stored record, whichever part the model reads: the hash of
            # the whole document, frontmatter included.
            entity.contentHash: b569d27bc637c9cf829af8df247208a31a808cc1894aca0c8c864119b8d1c415
            entity.metadata.title: Working Plan
        - toolName: system_update
          shouldBeCalled: false
successCriteria:
  expectedTools:
    - toolName: system_create
      shouldBeCalled: false
    - toolName: system_delete
      shouldBeCalled: false
