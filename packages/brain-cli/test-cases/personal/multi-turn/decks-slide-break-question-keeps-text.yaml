id: multi-turn-decks-slide-break-question-keeps-text
name: Deck Saved After the Slide-Break Question Keeps the Pasted Text
description: Verifies that when pasted deck text has no separators or headings, the brain asks where the slides break, and the save after the user's answer stores the pasted paragraphs unchanged, one per slide.
type: multi_turn
setup:
  permissionLevel: admin
tags:
  - decks
  - finalized-content
  - regression
  - verbatim-create
  - recipe-professional
successCriteria: {}
turns:
  - userMessage: |-
      Save this as a deck titled "Three Rules" now. Keep my text.

      Ship less, on purpose.

      Write it down while it's fresh.

      Ask a peer before you start from scratch.
    successCriteria:
      expectedTools:
        - toolName: system_create
          argsContain:
            entityType: deck
  - userMessage: Approve.
    confirmPendingAction: true
    successCriteria:
      expectedTools:
        - toolName: system_create
          resultErrorContains: After the user answers, call system_create again with source
  - userMessage: One slide per paragraph.
    successCriteria:
      expectedTools:
        - toolName: system_create
          argsContain:
            entityType: deck
  - userMessage: Approve.
    confirmPendingAction: true
    successCriteria:
      expectedTools:
        - toolName: system_create
          resultContains:
            success: true
            data.entityId: three-rules
  - userMessage: Read deck 'three-rules' from storage with part body. Do not change anything.
    successCriteria:
      expectedTools:
        - toolName: system_get
          argsContain:
            entityType: deck
            part: body
          resultContains:
            entity.content: "Ship less, on purpose.\n\n---\n\nWrite it down while it's fresh.\n\n---\n\nAsk a peer before you start from scratch.\n"
efficiency:
  maxToolCalls: 8
