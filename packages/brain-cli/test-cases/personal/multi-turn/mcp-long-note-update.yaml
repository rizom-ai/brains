# Separate protocol assertions; agent-service evals retain their internal trace assertions.
id: mcp-long-note-update
name: MCP chat/confirm preserves a 17 KB note through a title and body patch
description: "Protocol-layer contract: assert exact pending edits, cancelled storage and approved storage. Confirmation responses expose the approval summary, not private agent reads or the internal agent response text."
type: multi_turn
setup:
  permissionLevel: admin
  interfaceType: mcp
tags:
  - recipe-personal
  - mcp-protocol
  - regression
  - confirmation
turns:
  - userMessage: 'Read note ''mcp-long-note-update''. Change its title by replacing the H1 "Working Plan" with "Approved Plan", and replace the exact sentence "Review cadence: monthly." with "Review cadence: weekly." in the same proposed update. Preserve every other character, including backslashes and line endings. Request confirmation before saving; do not merely describe the edit.'
    successCriteria: &a1
      expectedTools:
        - toolName: system_update
          argsContain:
            entityType: note
            id: mcp-long-note-update
            edits: &a2
              - oldText: "# Working Plan"
                newText: "# Approved Plan"
              - oldText: "Review cadence: monthly."
                newText: "Review cadence: weekly."
          argsAbsent:
            - fields
            - content
            - confirmed
          resultContains:
            needsConfirmation: true
  - userMessage: Cancel that proposed update.
    confirmPendingAction: false
  - userMessage: Read note 'mcp-long-note-update' from storage now. Do not change anything; briefly state its title and review cadence.
