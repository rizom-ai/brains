# Separate protocol assertions; agent-service evals retain their internal trace assertions.
id: mcp-long-note-update
name: MCP chat/confirm preserves a 17 KB note through a title and body patch
description: "Protocol-layer contract: assert exact pending edits, cancelled storage and approved storage. Confirmation responses expose the approval summary, not private agent reads or the internal agent response text."
type: multi_turn
setup:
  permissionLevel: admin
  interfaceType: mcp
tags:
  - recipe-personal
  - mcp-protocol
  - regression
  - confirmation
turns:
  - userMessage: 'Read note ''mcp-long-note-update''. Change its title by replacing the H1 "Working Plan" with "Approved Plan", and replace the exact sentence "Review cadence: monthly." with "Review cadence: weekly." in the same proposed update. Preserve every other character, including backslashes and line endings. Request confirmation before saving; do not merely describe the edit.'
    successCriteria: &a1
      expectedTools:
        - toolName: system_update
          argsContain:
            entityType: note
            id: mcp-long-note-update
          argsAbsent:
            [
              "operation.fields",
              "operation.content",
              "confirmed",
              operation.source,
            ]
          resultContains:
            needsConfirmation: true
  - userMessage: Cancel that proposed update.
    confirmPendingAction: false
  - userMessage: Read note 'mcp-long-note-update' from storage now. Do not change anything; briefly state its title and review cadence.
    successCriteria:
      expectedTools:
        - toolName: system_get
          argsContain:
            entityType: note
            id: mcp-long-note-update
          resultContains:
            # The stored record, whichever part the model reads: the hash of
            # the whole document, frontmatter included.
            entity.contentHash: c93daf4f4dff5637ca3fd1b8a71a91f0e79938c668753eb16c6c91c426cb1c6c
        - toolName: system_update
          shouldBeCalled: false
  - userMessage: 'Read note ''mcp-long-note-update''. Change its title by replacing the H1 "Working Plan" with "Approved Plan", and replace the exact sentence "Review cadence: monthly." with "Review cadence: weekly." in the same proposed update. Preserve every other character, including backslashes and line endings. Request confirmation before saving; do not merely describe the edit.'
    successCriteria: *a1
  - userMessage: Approve this exact proposed update.
    confirmPendingAction: true
    successCriteria:
      expectedTools:
        - toolName: system_update
          argsContain:
            entityType: note
            id: mcp-long-note-update
          argsAbsent:
            ["operation.fields", "operation.content", operation.source]
          resultContains:
            updated: mcp-long-note-update
  - userMessage: Read note 'mcp-long-note-update' from storage again to verify the saved edit. Do not change anything; briefly state its title and review cadence.
    successCriteria:
      expectedTools:
        - toolName: system_get
          argsContain:
            entityType: note
            id: mcp-long-note-update
          resultContains:
            # The stored record, whichever part the model reads: the hash of
            # the whole document, frontmatter included.
            entity.contentHash: 67fb5c920965cf08bc76279344f590f32d96ec7927017957072728641c4a64e2
            entity.metadata.title: Approved Plan
        - toolName: system_update
          shouldBeCalled: false
successCriteria:
  expectedTools:
    - toolName: system_create
      shouldBeCalled: false
    - toolName: system_delete
      shouldBeCalled: false
