id: recipe-commerce-search-site-info
name: Commerce brain retrieves organization site information
description: Verifies that the commerce recipe can read organization site metadata.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - recipe-commerce
  - commerce
  - site
  - tool-invocation

turns:
  - userMessage: "Get the saved site-info record and summarize our organization site."

successCriteria:
  expectedTools:
    - toolName: system_get
      shouldBeCalled: true
      argsContain:
        entityType: site-info
        id: site-info
  responseNotContains:
    - "I cannot"
    - "site capability is unavailable"

efficiency:
  maxToolCalls: 3
  maxTokens: 20000
