brain: brain
anchor: person
kind: professional
bundles:
  - core
  - site
  - publishing

add:
  - web-chat
  - obsidian-vault

site:
  package: "@brains/site-personal"
  theme: "@rizom/theme-default"

plugins:
  directory-sync:
    seedContentPath: ../../eval-content/personal
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/canonical-personal-test-content
      gitUrl: file:///tmp/canonical-personal-test-content.git
      bootstrapFromSeed: true
  onboarding:
    enabled: true
remove:
  - series
  - portfolio
  - content-pipeline
  - social-media
  - newsletter
  - stock-photo
