brain: brain
bundleContract: capability-bundles-v1
anchor: person
kind: professional
bundles:
  - core
  - web
  - chat

permissions:
  rules:
    - pattern: "slack:U0BGKJ4MA5B"
      level: admin
    - pattern: "slack:*"
      level: public

plugins:
  chat:
    adapters:
      slack:
        mode: socket
        botToken: ${SLACK_BOT_TOKEN}
        appToken: ${SLACK_APP_TOKEN}
        requireMention: true
        allowDMs: true
        allowedChannels: []
  directory-sync:
    seedContentPath: ../../eval-content/core
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/canonical-slack-test-content
      gitUrl: file:///tmp/canonical-slack-test-content.git
