# The personal brain with its own Matrix homeserver. From packages/brain-cli,
# export these in both shells, start the homeserver with
#   bun ../../plugins/matrix-server/scripts/local-homeserver.ts
# then the app. The brain writes the homeserver's configuration and secrets
# into MATRIX_DATA_DIR; nothing secret is set here.
#   MATRIX_SERVER_NAME=localhost
#   MATRIX_PUBLIC_URL=http://localhost:8080
#   MATRIX_HOMESERVER_URL=http://127.0.0.1:6167
#   MATRIX_DATA_DIR=<a directory both share>
#   MATRIX_BASE_URL=http://localhost:8080     # the chat bot goes through the brain
#   MATRIX_USER_ID=@_brain:localhost
brain: brain
bundleContract: capability-bundles-v1
anchor: person
kind: professional
bundles:
  - core
  - media
  - web
  - chat
  - matrix

plugins:
  directory-sync:
    seedContentPath: ../../eval-content/recipes/personal
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/canonical-matrix-test-content
      gitUrl: file:///tmp/canonical-matrix-offline-test-content.git
      bootstrapFromSeed: true
