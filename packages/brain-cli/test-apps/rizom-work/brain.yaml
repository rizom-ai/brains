brain: brain
bundleContract: capability-bundles-v1
anchor: organization
kind: organization
# rizom.work, as its deployment composes it: Rizom B.V.'s site on
# @rizom/site-rizom-work, standing on the copy the package starts with.
bundles:
  - core
  - web
  - site

add:
  - site-content
  - contact

# Local test app: Admin tools (build-site etc.) available over MCP
# http transport.
permissions:
  rules:
    - pattern: "mcp:http"
      level: admin

site:
  package: "@rizom/site-rizom-work"
  theme: "@rizom/theme-rizom-ai"

plugins:
  mcp:
    mode: debug
  contact: {}
  directory-sync:
    seedContentPath: ../../eval-content/core
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/rizom-work-test-content
      gitUrl: file:///tmp/rizom-work-offline-test-content.git
      bootstrapFromSeed: true
  onboarding:
    enabled: false
  site-builder:
    autoRebuild: false
