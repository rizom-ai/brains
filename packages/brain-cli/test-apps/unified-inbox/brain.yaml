brain: brain
anchor: person
kind: professional
bundles:
  - core
  - site
  - publishing

add:
  - email-workflows
  - unified-inbox

site:
  package: "@brains/site-professional"
  theme: "@rizom/theme-default"

plugins:
  directory-sync:
    seedContentPath: ../../eval-content/core
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/canonical-unified-inbox-test-content
      gitUrl: file:///tmp/canonical-unified-inbox-test-content.git
      bootstrapFromSeed: true
  onboarding:
    enabled: false
  email:
    transport: resend
    apiKey: ${SETUP_EMAIL_API_KEY}
    from: ${SETUP_EMAIL_FROM}
    imap:
      host: imap.migadu.com
      port: 993
      user: ${IMAP_USER}
      password: ${IMAP_PASSWORD}
      mailbox: INBOX
      pollMode: interval
      pollIntervalMs: 5000
  notifications:
    defaultRecipient:
      type: email
      address: ${SETUP_EMAIL_TO}
