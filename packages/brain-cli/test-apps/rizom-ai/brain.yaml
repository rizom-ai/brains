brain: brain
bundleContract: capability-bundles-v1
anchor: organization
kind: organization
bundles:
  - core
  - media
  - automation
  - web
  - site
  - publishing
  - federation

# Keep the production-adjacent Rizom composition web-enabled but without the
# full chat bundle. Its selected interfaces remain explicit opt-ins.
add:
  - web-chat
  - email
  - notifications
  - obsidian-vault
  - contact

# Local test app: Admin tools (build-site etc.) available over MCP
# http transport.
permissions:
  rules:
    - pattern: "mcp:http"
      level: admin

site:
  package: "@rizom/site-rizom-ai"
  theme: "@rizom/theme-rizom-ai"

plugins:
  mcp:
    mode: debug
  # Local acceptance of the contact form behind rizom.ai's "Book an audit":
  # loopback origin and test-only limits and retention, not a production policy.
  contact:
    intake:
      http:
        origin: http://localhost:8080
        maxBodyBytes: 20000
        readTimeoutMs: 10000
      admission:
        windowSeconds: 3600
        globalRequests: 300
        networkRequests: 100
        globalForms: 60
        networkForms: 30
        globalSubmissions: 20
        networkSubmissions: 10
        tokenTtlSeconds: 1800
        receiptTtlSeconds: 600
        maxEntries: 500
      storage:
        retentionSeconds: 86400
        maxRecords: 50
        maxBytes: 500000
      delivery:
        maxAttempts: 3
        retryWindowSeconds: 3600
      inboxUrl: http://localhost:8080/studio/workspaces/unified-inbox%3Ainbox
      preview: true
  directory-sync:
    seedContentPath: /home/yeehaa/Documents/rizom-content
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/rizom-ai-test-content
      gitUrl: file:///tmp/rizom-ai-test-content.git
      bootstrapFromSeed: true
remove:
  - series
  - portfolio
  - content-pipeline
  - social-media
  - newsletter
  - stock-photo
