brain: brain
anchor: organization
kind: organization
bundles:
  - core
  - site
  - publishing

# The consolidated production rizom.ai composition at the alpha.204
# pre-bundle baseline: Rover's default preset already carries
# blog/decks/site-builder; explicit additions preserve the registry
# (canonical ai.rizom.brain.* lexicons), product entities, newsletter,
# ecosystem surface, and site-content entity type.
add:
  - web-chat
  - atproto-registry
  - products
  - rizom-ecosystem
  - newsletter
  - site-content
  - obsidian-vault

# Local test app: Admin tools (build-site etc.) available over MCP
# http transport.
permissions:
  rules:
    - pattern: "mcp:http"
      level: admin

site:
  package: "@rizom/site-rizom-ai"
  theme: "@rizom/theme-rizom-ai"

plugins:
  mcp:
    mode: debug
  directory-sync:
    seedContentPath: /home/yeehaa/Documents/rizom-content
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/rizom-ai-test-content
      gitUrl: file:///tmp/rizom-ai-test-content.git
      bootstrapFromSeed: true
remove:
  - series
  - portfolio
  - content-pipeline
  - social-media
  - newsletter
  - stock-photo
