      lungen, für welche jede Partei ihr eigenes Organ besitzt.
      Tabelle der kritisch vollständigen Justiz.
      Bestehende Justiz. | Kritisch ergänzende Justiz.
      Namen: Justice Criminelle. | Namen: Justice Vertueuse.
      Signalement: hält in der Hand ein Schwert, um die Bösen um einen Kopf zu verkürzen. | Signalement: hält in der Hand eine Krone, um die Guten um einen Kopf zu erhöhen.
      Zweck: Bestrafung des Bösen, Gefangenschaft, Infamie, Lebensberaubung. Das Volk erfährt die schreckliche Züchtigung für den Bösen. | Zweck: Belohnung des Guten, Freitisch, Ehre, Lebenserhaltung. Das Volk erfährt den eklatanten Triumph für den Guten.
      Mittel um die Bösen zu entdecken: Polizeiliche Spionage, Mouchards, um den Bösen aufzulauern. | Mittel um die Guten zu entdecken: Espionage de vertu, Mouchards, um den Tugendhaften aufzulauern.
      Entscheidung, ob Einer ein Böser sei: Les assises du crime, Assisen für das Verbrechen. Das öffentliche Ministerium signalisirt die Verbrechen des Angeklagten und denunzirt sie der öffentlichen Rache. | Entscheidung, ob Einer ein Guter sei: Assises de la vertu, Assisen für die Tugend. Das öffentliche Ministerium signalisirt die edlen Handlungen des Angeklagten und denunzirt sie der öffentlichen Erkenntlichkeit.
      Zustand des Verbrechers nach dem Urtheil: Er steht unter der surveillance de la haute police. Er wird ernährt im Gefängniß. Der Staat macht Ausgaben für ihn. | Zustand des Tugendhaften nach dem Urtheil: Er steht unter der surveillance de la haute charité morale. Er wird ernährt in seinem Hause. Der Staat macht Ausgaben für ihn.
      Exekution. Der Verbrecher steht auf dem Schafott. | Exekution. Gerade gegenüber dem Schafott des Verbrechers erhebt sich ein Piedestal, worauf der grand homme de bien steigt — Ein Tugendpranger.
