# Sigmund Freud's works from the Gesammelte Werke (Imago, London 1940–52),
# read from the Internet Archive's scans. The author's text is in the public
# domain (author †1939); the editors' apparatus is left out: their prefaces,
# the bibliographic notes, the indexes, the note on Breuer's omitted parts in
# Studien über Hysterie (I, 76) and the Traumdeutung's list of literature
# (II/III, 627–642). `year` is first publication; short pieces the edition
# prints under a collective title are one book per volume. The scan of GW I
# lacks pages 74–75 (a blank page and the half-title of Studien über
# Hysterie). Four neurological monographs the edition does not print are read
# from scans of their first editions: Zur Auffassung der Aphasien (1891), the
# Klinische Studie über die halbseitige Cerebrallähmung der Kinder written
# with Oscar Rie (1891), Zur Kenntniss der cerebralen Diplegien des
# Kindesalters (1893) and Die infantile Cerebrallähmung (1897); the Diplegien
# are read anew from their scan (`ocr`), which has no archive text.
# Their literature lists, tables of contents and publishers’ advertisements
# are left out; the Aphasien keep their dedication. His papers of 1877–1895
# that the edition does not print, in the Akademie's Sitzungsberichte and
# the journals of anatomy, psychiatry and neurology, are read from scans of
# their first printings, and Ueber Coca from its revised reprint of 1885.
source: archive-ocr
coverage:
  author: Sigmund Freud
  edition: the Gesammelte Werke, chronologically ordered, edited by Anna Freud and others (Imago, London 1940–52), and for the papers and neurological monographs of 1877–1897 their first printings, read from the Internet Archive's scans
  license: The author's text is in the public domain; the editors' prefaces, notes and indexes are left out.
