# Karl Marx's works, read from the Deutsches Textarchiv's TEI transcriptions
# of their first editions (the Brumaire from the second, 1869), and from
# Wikisource's transcriptions of the Deutsch-Französische Jahrbücher (1844)
# and of the Thesen über Feuerbach as Engels first printed them (1888). The
# Textarchiv's transcriptions are under CC BY-SA 4.0, the Manifest's under
# CC BY-SA 2.0 DE; Wikisource's are of public-domain texts. Of the letters the
# Jahrbücher print as "Ein Briefwechsel von 1843", only Marx's three are kept;
# of the first volume of the Briefwechsel with Engels (Project Gutenberg's
# ebook of the 1921 printing), only Marx's letters, without the editors'
# introductions and notes; and Marx's German letters of 1866–1871 from
# MEGAdigital (CC BY-SA 4.0), his letters in English and French left out; and
# the economic manuscripts of 1857/58 and 1863–65 from MEGAdigital's
# transcription of MEGA² II/1 (1976–1981) and II/4.1 (1988), whose edition
# right (§ 70 UrhG) ran out 25 years after each volume appeared; the editors'
# apparatus and Marx's English "Value, price and profit" are left out.
# Works printed in Fraktur are read anew from archive.org's scans (`ocr`):
# Die Klassenkämpfe in Frankreich (1895), and Marx's and the joint writings
# of 1841–1847 that Franz Mehring collected in Aus dem literarischen Nachlass
# (1902), without his introductions and notes and without Engels' own pieces.
# `year` is first publication, for letters the year of the first. The second
# and third volumes of Das Kapital appeared after Marx's death, edited by
# Engels; Engels' prefaces to them are left out. The third volume is two
# books, as printed, each paged on its own.
source: dta-tei
coverage:
  author: Karl Marx
  edition: first editions where they could be had, and otherwise the early editions of Engels, Kautsky and Mehring or MEGAdigital's transcriptions of the manuscripts, transcribed by the Deutsches Textarchiv, Wikisource and Project Gutenberg or read from the Internet Archive's scans
  license: The author's text is in the public domain; the Textarchiv's and MEGAdigital's transcriptions are under the CC BY-SA licences each work names. Editors' prefaces and introductions are left out.
gaps:
  - title: Kritik des Hegelschen Staatsrechts
    year: 1843
    reason: no scan of its first printing (MEGA I/1.1, 1927) found on the Internet Archive
  - title: Ökonomisch-philosophische Manuskripte
    year: 1844
    reason: no scan of its first printing (MEGA I/3, 1932) found on the Internet Archive
  - title: Die deutsche Ideologie
    year: 1846
    reason: no scan of its first full printing (MEGA I/5, 1932) found on the Internet Archive; the copies there are later editions of unknown source
  - title: Briefe an Engels 1854–1883
    year: 1854
    reason: of the second to fourth volumes of the Briefwechsel (1913), only the third is identified among the Internet Archive's scans
  - title: Herr Vogt
    year: 1860
    reason: the only scan of the first edition (London, 1860) reads below the OCR gate, 1 wrong word in 68
  - title: Inauguraladresse der Internationalen Arbeiter-Assoziation
    year: 1864
    reason: no scan of a German edition found on the Internet Archive
  - title: Lohn, Preis und Profit
    year: 1865
    reason: no scan of the German edition (1908) found on the Internet Archive, which holds only a recording
