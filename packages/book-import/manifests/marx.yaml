# Karl Marx's works, read from the Deutsches Textarchiv's TEI transcriptions
# of their first editions (the Brumaire from the second, 1869), and from
# Wikisource's transcriptions of the Deutsch-Französische Jahrbücher (1844)
# and of the Thesen über Feuerbach as Engels first printed them (1888). The
# Textarchiv's transcriptions are under CC BY-SA 4.0, the Manifest's under
# CC BY-SA 2.0 DE; Wikisource's are of public-domain texts. Of the letters the
# Jahrbücher print as "Ein Briefwechsel von 1843", only Marx's three are kept,
# a published work; his other letters are not. The economic manuscripts of
# 1857/58 and 1863–65 (the first book; the second is a draft Das Kapital II
# supersedes) come from MEGAdigital's
# transcription of MEGA² II/1 (1976–1981) and II/4.1 (1988), whose edition
# right (§ 70 UrhG) ran out 25 years after each volume appeared; the editors'
# apparatus is left out. A work Marx wrote in English or French is read in
# his own words: Value, Price and Profit from the 1899 London edition, The
# Civil War in France and the addresses on the Franco-Prussian War from
# en.wikisource, the Misère de la philosophie and the Discours sur la
# question du libre-échange from fr.wikisource's transcription of the 1896
# Paris edition. Le Capital is the French edition Marx revised (1872–75).
# The Secret Diplomatic History is Project Gutenberg's transcription.
# Works printed in Fraktur are read anew from archive.org's scans (`ocr`):
# Die Klassenkämpfe in Frankreich (1895), and Marx's and the joint writings
# of 1841–1847 that Franz Mehring collected in Aus dem literarischen Nachlass
# (1902), without his introductions and notes and without Engels' own pieces.
# `year` is first publication. The second
# and third volumes of Das Kapital appeared after Marx's death, edited by
# Engels; Engels' prefaces to them are left out. The third volume is two
# books, as printed, each paged on its own.
source: dta-tei
coverage:
  author: Karl Marx
  edition: first editions where they could be had, and otherwise the early editions of Engels, Kautsky and Mehring or MEGAdigital's transcriptions of the manuscripts, and for works with no early edition at hand the Marx-Engels-Werke as mlwerke.de published them, transcribed by the Deutsches Textarchiv, MEGAdigital and Wikisource or read from the Internet Archive's scans
  license: The author's text is in the public domain; the Textarchiv's and MEGAdigital's transcriptions are under the CC BY-SA licences each work names. Editors' prefaces, introductions and notes are left out; the authors' own notes are kept.
