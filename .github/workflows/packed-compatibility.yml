name: Packed Compatibility

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packed-compatibility
  cancel-in-progress: false

jobs:
  compatibility:
    name: External authoring compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run packed compatibility matrix
        run: |
          set -o pipefail
          bun run test:packed:compat \
            2>&1 | tee "$RUNNER_TEMP/packed-compatibility.log"

      - name: Upload packed compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-compatibility-${{ github.run_id }}
          path: ${{ runner.temp }}/packed-compatibility.log
          if-no-files-found: warn
