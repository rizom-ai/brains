name: Core CI

on:
  # Site/theme packages have their own scoped CI. Ordered include/exclude
  # patterns keep site-only work from being blocked by unrelated core checks.
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!sites/docs/**"
      - "!sites/rizom/**"
      - "!sites/rizom-ai/**"
      - "!sites/rizom-foundation/**"
      - "!sites/rizom-work/**"
      - "!sites/smoke-canary/**"
      - "!shared/theme-default/**"
      - "!shared/theme-rizom-ai/**"
      - "!shared/theme-signal/**"
      - "!packages/site/**"
      - "!packages/site-sections/**"
      - "!.github/workflows/site-ci.yml"
      - "!.github/workflows/site-release.yml"
      - ".changeset/core--*.md"
      - "!.changeset/site--*.md"
  # Escape hatch for the docs-only deadlock: a docs/markdown-only push skips
  # Core CI, so a pending core changeset can strand with no Release trigger
  # (Release fires off Core CI completing on main).
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.claude/**"
      - "!sites/docs/**"
      - "!sites/rizom/**"
      - "!sites/rizom-ai/**"
      - "!sites/rizom-foundation/**"
      - "!sites/rizom-work/**"
      - "!sites/smoke-canary/**"
      - "!shared/theme-default/**"
      - "!shared/theme-rizom-ai/**"
      - "!shared/theme-signal/**"
      - "!packages/site/**"
      - "!packages/site-sections/**"
      - "!.github/workflows/site-ci.yml"
      - "!.github/workflows/site-release.yml"
      - ".changeset/core--*.md"
      - "!.changeset/site--*.md"

# Turbo Remote Cache: populated by Vercel-hosted cache server. TURBO_TOKEN
# is a Vercel CLI token; TURBO_TEAM is the Vercel team slug. With both set,
# turbo reads/writes cache entries shared with developer machines. Without,
# turbo falls back to local actions/cache restore only.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Lint core packages
        run: bun scripts/lint.mjs --filter='!@rizom/site*' --filter='!@rizom/theme*'

      - name: Check legacy code inventory
        run: bun run legacy:check

      # Runs here rather than as its own job so it reuses this job's checkout,
      # install and cache. lint-staged only formats staged files, so without
      # this nothing ever re-checks a file that stops matching prettier after a
      # version bump.
      - name: Format core files
        run: bun run format:check:core

      - name: Validate release queues
        run: bun run changeset:check

  typecheck:
    name: Type check
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Type check core packages
        run: bunx turbo run typecheck --filter='!@rizom/site*' --filter='!@rizom/theme*'

  test:
    name: Test (${{ matrix.engine }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [libsql, turso]
    env:
      BRAINS_DB_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-test-${{ matrix.engine }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ matrix.engine }}-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Test core packages
        run: bunx turbo run test --concurrency="$(nproc)" --filter='!@rizom/site*' --filter='!@rizom/theme*'

  build:
    name: Build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
            turbo-${{ runner.os }}-

      # Build every relevant core package in dependency order so a package that
      # fails to build is caught here, not at release time.
      - name: Build core packages
        run: bunx turbo run build --filter='!@rizom/site*' --filter='!@rizom/theme*'
