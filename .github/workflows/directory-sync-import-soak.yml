name: Directory Sync Import Soak

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      git_broker_acceptance:
        description: Run the approved affected-Bun Git broker acceptance matrix
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: directory-sync-import-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup repository Bun
        if: ${{ !inputs.git_broker_acceptance }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup affected Bun
        if: ${{ inputs.git_broker_acceptance }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Record runtime version
        run: bun --version | tee "$RUNNER_TEMP/bun-version.log"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packaged runtime
        id: build
        run: bunx turbo run build --filter=@rizom/brain

      - name: Run packaged Git broker recovery and fallback
        if: ${{ inputs.git_broker_acceptance && steps.build.outcome == 'success' && !cancelled() }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          bun run test:git-broker-recovery \
            2>&1 | tee "$RUNNER_TEMP/git-broker-affected-runtime.log"

      - name: Run 100-cycle Git process inventory
        if: ${{ inputs.git_broker_acceptance && steps.build.outcome == 'success' && !cancelled() }}
        timeout-minutes: 10
        env:
          RUN_GIT_ZOMBIE_SOAK: 1
          GIT_ZOMBIE_SOAK_CYCLES: 100
        run: |
          set -o pipefail
          bun run test:git-broker-process-inventory \
            2>&1 | tee -a "$RUNNER_TEMP/git-broker-affected-runtime.log"

      - name: Run feature-enabled resource gate
        env:
          MOCKED_AI_IMPORT_COUNT: 350
          MOCKED_AI_SERVICE_DELAY_MS: 100
          MOCKED_AI_CPU_LIMIT: 2
        run: |
          set -o pipefail
          bun test packages/brain-cli/test/import-burst-feature-load.test.ts \
            2>&1 | tee "$RUNNER_TEMP/directory-sync-feature-resource.log"

      - name: Run directory-sync import soak
        if: ${{ steps.build.outcome == 'success' && !cancelled() }}
        env:
          RUN_IMPORT_BURST_SOAK: 1
          IMPORT_BURST_FILE_COUNT: 350
        run: |
          # Actions bash has no pipefail by default; without it a failing
          # soak exits 0 through tee and the failure notification never fires.
          set -o pipefail
          passes=1
          if [[ "${{ inputs.git_broker_acceptance }}" == "true" ]]; then
            passes=3
          fi
          : > "$RUNNER_TEMP/directory-sync-import-soak.log"
          for pass in $(seq 1 "$passes"); do
            bun test packages/brain-cli/test/import-burst-stability.test.ts \
              2>&1 | tee "$RUNNER_TEMP/directory-sync-import-soak-pass-${pass}.log" \
              | tee -a "$RUNNER_TEMP/directory-sync-import-soak.log"
          done

      - name: Run affected-runtime full core checks
        if: ${{ inputs.git_broker_acceptance && !cancelled() }}
        timeout-minutes: 25
        run: |
          set -o pipefail
          {
            bun scripts/lint.mjs --filter='!@rizom/site*' --filter='!@rizom/theme*'
            bunx turbo run typecheck --filter='!@rizom/site*' --filter='!@rizom/theme*'
            bunx turbo run test --concurrency="$(nproc)" --filter='!@rizom/site*' --filter='!@rizom/theme*'
            bunx turbo run build --filter='!@rizom/site*' --filter='!@rizom/theme*'
            mkdir -p "$RUNNER_TEMP/package"
            (cd packages/brain-cli && bun pm pack --destination "$RUNNER_TEMP/package")
          } 2>&1 | tee -a "$RUNNER_TEMP/git-broker-affected-runtime.log"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-sync-import-soak-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bun-version.log
            ${{ runner.temp }}/directory-sync-feature-resource.log
            ${{ runner.temp }}/directory-sync-import-soak*.log
            ${{ runner.temp }}/git-broker-affected-runtime.log
            ${{ runner.temp }}/package/*.tgz
          if-no-files-found: warn

      - name: Notify operator of soak failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Directory sync nightly soak failed (${context.runId})`,
              body: `The nightly directory-sync import soak failed.\n\nRun: ${runUrl}`,
            });
