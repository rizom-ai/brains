name: Release

on:
  # Chain off Core CI so a red core build never produces an npm publish. Release
  # runs as a no-op when there are no pending changesets. On prerelease exit,
  # this workflow versions the one global stable plan before the two workflows
  # publish their own lanes. This keeps the downstream image/deploy chain linear
  # (CI → Release → Publish Images → Deploy) for release and non-release pushes.
  workflow_run:
    workflows: [Core CI]
    types: [completed]
    branches: [main]
  # Manual trigger so operators can kick off a release run without
  # pushing a commit — handy for re-running a failed publish against
  # an already-bumped main, or for running a release out of band.
  workflow_dispatch:

# Shared with Site Release so two version commits can never race on main.
concurrency: npm-release-main

jobs:
  release:
    name: Core Release
    # Fork-safety: only run on the canonical repo. Forks shouldn't
    # attempt to publish releases for the upstream packages.
    # For workflow_run events, also gate on the upstream CI run having
    # succeeded — workflow_run fires on both success and failure.
    if: >
      github.repository == 'rizom-ai/brains' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      DOCS_CONTENT_SYNC_TOKEN: ${{ secrets.DOCS_CONTENT_SYNC_TOKEN }}
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      # Check out the branch tip, not the trigger-time SHA. When one push has
      # pending changesets in both lanes, the release that loses the shared
      # concurrency lock would otherwise version a base that is one version
      # commit behind main and fail its push as non-fast-forward.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      # Changesets' GitHub changelog lookup currently uses node-fetch@2,
      # which can fail with ERR_STREAM_PREMATURE_CLOSE on the Node versions
      # bundled in the ubuntu-24.04 runner image. Pin the repository's Node
      # release before invoking the changeset CLI through its Node shebang.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Single-run release flow:
      #
      #   1. `changeset version` consumes pending changesets and bumps
      #      package versions + writes CHANGELOG.md. Idempotent — a no-op
      #      when there are no pending changesets.
      #   2. Push the version bump commit back to main (if any files
      #      changed). Must happen BEFORE publish so the repo reflects
      #      reality even if the npm publish step crashes later; the
      #      retry semantics of `changeset publish` are "republish if
      #      version not on registry" so a re-run picks up cleanly.
      #   3. `changeset publish` runs `prepublishOnly` (bundle via
      #      packages/brain-cli/scripts/build.ts) then `npm publish`.
      #      Only publishes versions not already on npm.
      #
      # No version PR and no second workflow dependency. Alpha bumps remain
      # automatic. Stable graduation requires the reviewed `pre exit` state;
      # queue validation checks its global plan before this job versions it.
      - name: Configure git for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect release mode
        id: release_mode
        run: |
          mode="$(bun scripts/release-lane.ts mode)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode"

      - name: Validate release queues
        run: bun run changeset:check

      # Normal releases hide site changesets and version only core. Changesets
      # prerelease exit is global, so core owns that one version pass while Site
      # Release waits for the generated version commit.
      - name: Version core packages or coordinated stable plan
        env:
          # @changesets/changelog-github hits the GitHub API to resolve
          # PR numbers, commit authors, and link URLs for the generated
          # changelog. Without a token, changeset version crashes before
          # it can write package.json or CHANGELOG.md.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run changeset:version:core

      - name: Commit and push version bump
        env:
          HUSKY: "0"
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): version packages"
            git push
          fi

      - name: Run packed compatibility matrix
        run: bun run test:packed:compat

      - name: Run pre-publish smoke tests
        run: bun --filter @rizom/ops test:smoke

      # Build the core lane in dependency order before publishing. Even after
      # global stable versioning, site/theme publication remains in Site Release.
      - name: Build core packages
        run: bunx turbo run build --filter='!@rizom/site*' --filter='!@rizom/theme*'

      - name: Publish to npm
        run: bun run changeset:publish:core

      # Version commits pushed with GITHUB_TOKEN do not start push workflows.
      # Explicitly dispatch the site check chain only after stable core publish
      # succeeds; Site Release remains the sole site/theme publisher.
      - name: Start stable site release checks
        if: steps.release_mode.outputs.mode != 'standard'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site-ci.yml --ref main

      - name: Sync docs content repo
        if: env.DOCS_CONTENT_SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DOCS_CONTENT_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          gh auth setup-git
          gh repo clone rizom-ai/doc-brain-content "$workdir/content"
          git -C "$workdir/content" config user.name "github-actions[bot]"
          git -C "$workdir/content" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bun scripts/sync-docs-content.ts --out "$workdir/content"
          git -C "$workdir/content" add -A doc

          if git -C "$workdir/content" diff --cached --quiet; then
            echo "Docs content is already up to date."
          else
            git -C "$workdir/content" commit -m "docs: sync from rizom-ai/brains@${source_sha:0:7}"
            git -C "$workdir/content" push origin HEAD:main
          fi
