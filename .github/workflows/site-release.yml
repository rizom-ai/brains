name: Site Release

on:
  # Site/theme publishing has an independent CI gate and trigger. Core Release
  # can dispatch Site CI for stable graduation, but only this workflow publishes
  # the site lane.
  workflow_run:
    workflows: [Site CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # Mode must be known before assigning release concurrency. Standard site
  # releases share the main version-commit lock with Core Release. A generated
  # stable version commit needs no second version pass, so its publish job uses
  # a distinct lock and can run while Core Release waits for the stable SDK.
  classify:
    name: Classify Site Release
    if: >
      github.repository == 'rizom-ai/brains' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.release_mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Detect release mode
        id: release_mode
        run: |
          mode="$(bun scripts/release-lane.ts mode)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode"

  release:
    name: Site and Theme Release
    needs: classify
    if: ${{ needs.classify.outputs.mode != 'stable-exit' }}
    concurrency:
      group: ${{ needs.classify.outputs.mode == 'stable-version' && 'npm-stable-site-release' || 'npm-release-main' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Standard releases use the branch tip so two lane-specific version
      # commits cannot diverge. Coordinated stable publication stays pinned to
      # the generated version commit that passed Site CI.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.mode == 'stable-version' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Configure git for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release queues
        run: bun run changeset:check

      # Changesets prerelease exit versions every package in one global pass.
      # Core Release owns that pass. Standard site releases still version only
      # their lane; stable-version resumes directly from the generated commit.
      - name: Version site and theme packages
        if: needs.classify.outputs.mode == 'standard'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run changeset:version:site

      - name: Commit and push version bump
        if: needs.classify.outputs.mode == 'standard'
        env:
          HUSKY: "0"
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No site/theme version changes to commit."
          else
            git commit -m "chore(release): version site and theme packages"
            git push
          fi

      # Standard releases require the current core version on npm. Stable
      # graduation intentionally reverses that order: the site lane verifies
      # the final Brain alpha from the parent revision, publishes the stable SDK,
      # and leaves stable Brain publication to the waiting Core Release.
      - name: Verify compatible core runtime is published
        run: |
          set -euo pipefail
          if [ "${{ needs.classify.outputs.mode }}" = "stable-version" ]; then
            expected="$(git show HEAD^:packages/brain-cli/package.json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)')"
            if [[ ! "$expected" =~ ^0\.2\.0-alpha\.[0-9]+$ ]]; then
              echo "Stable site publication requires an exact final Brain alpha, received: $expected" >&2
              exit 1
            fi
          else
            expected="$(bun -e 'console.log((await Bun.file("packages/brain-cli/package.json").json()).version)')"
          fi

          for attempt in {1..8}; do
            actual="$(npm view "@rizom/brain@${expected}" version 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Verified @rizom/brain@${expected}."
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep_seconds=$((attempt * 5))
              echo "@rizom/brain@${expected} is not available yet; retrying in ${sleep_seconds}s."
              sleep "$sleep_seconds"
            fi
          done
          echo "@rizom/brain@${expected} must be published before the site lane publishes." >&2
          exit 1

      - name: Run packed compatibility matrix
        run: bun run test:packed:compat

      - name: Build site and theme packages
        run: bunx turbo run build --filter='@rizom/site*' --filter='@rizom/theme*'

      # This checks the exact prepared manifests before npm sees them. A bad
      # peer range, authoring-only field, or workspace: specifier aborts before
      # the first irreversible publish.
      - name: Verify site/theme publish metadata
        run: bun scripts/verify-site-publish-metadata.ts

      - name: Publish site and theme packages to npm
        run: bun run changeset:publish:site

      - name: Deprecate retired alpha-only site packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          # npm can update every matching version and still return E404 for the
          # wildcard request. The registry verifier below is the fail-closed gate.
          npm deprecate '@rizom/site-sections@*' 'This alpha-only package is retired. Migrate to @rizom/site: https://github.com/rizom-ai/brains/blob/main/docs/external-site-authoring.md' || true
          npm deprecate '@rizom/site-rizom@*' 'This alpha-only package is retired. Its implementation is part of @rizom/site-rizom-ai.' || true
          bun scripts/verify-retired-package-deprecations.ts

      - name: Verify registry and tarball metadata
        run: bun scripts/verify-published-peer-metadata.ts

  defer-stable-exit:
    name: Await Global Stable Version Commit
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'stable-exit' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Core Release must create the one global stable version commit."
