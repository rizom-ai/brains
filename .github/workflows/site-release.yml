name: Site Release

on:
  # Site/theme publishing has an independent CI gate and trigger. Core Release
  # never runs this workflow and cannot publish this lane.
  workflow_run:
    workflows: [Site CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stable_sdk_version:
        description: Exact stable @rizom/site version to publish from the checked alpha source
        required: false
        type: string

# Shared with Release so version commits cannot race on main.
concurrency: npm-release-main

jobs:
  release:
    name: Site and Theme Release
    if: >
      github.repository == 'rizom-ai/brains' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Check out the branch tip, not the trigger-time SHA — see the matching
      # comment in release.yml for the two-lane version-commit race.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          # Honors packageManager in package.json, so CI runs the toolchain
          # the repo pins instead of whatever bun released today.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Detect release mode
        id: release_mode
        run: |
          mode="$(bun scripts/release-lane.ts mode)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode"

      - name: Configure git for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release queues
        run: bun run changeset:check

      # Changesets prerelease exit versions every package in one plan. Core
      # Release owns that pass; this run resumes from the generated version
      # commit, where the mode becomes stable-version.
      - name: Defer global stable versioning to Core Release
        if: steps.release_mode.outputs.mode == 'stable-exit'
        run: echo "Waiting for Core Release to create the stable version commit."

      - name: Version site and theme packages
        if: steps.release_mode.outputs.mode != 'stable-exit'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run changeset:version:site

      - name: Commit and push version bump
        if: steps.release_mode.outputs.mode != 'stable-exit'
        env:
          HUSKY: "0"
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No site/theme version changes to commit."
          else
            git commit -m "chore(release): version site and theme packages"
            git push
          fi

      # The site lane never publishes while the repo's current core version is
      # missing from npm. This guards every publish run, not just a detected
      # prerelease exit — if a core publish failed after its version commit,
      # mode detection may read standard here, but this check still blocks and
      # leaves Site Release safely retryable. Normal runs pass on the first
      # lookup because the checked-out core version is already published.
      - name: Verify core runtime is published
        if: steps.release_mode.outputs.mode != 'stable-exit'
        run: |
          set -euo pipefail
          expected="$(bun -e 'console.log((await Bun.file("packages/brain-cli/package.json").json()).version)')"
          for attempt in {1..8}; do
            actual="$(npm view "@rizom/brain@${expected}" version 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Verified @rizom/brain@${expected}."
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep_seconds=$((attempt * 5))
              echo "@rizom/brain@${expected} is not available yet; retrying in ${sleep_seconds}s."
              sleep "$sleep_seconds"
            fi
          done
          echo "@rizom/brain@${expected} must be published before the site lane publishes." >&2
          exit 1

      - name: Build site and theme packages
        if: steps.release_mode.outputs.mode != 'stable-exit'
        run: bunx turbo run build --filter='@rizom/site*' --filter='@rizom/theme*'

      # This checks the exact prepared manifests before npm sees them. A bad
      # peer range, authoring-only field, or workspace: specifier aborts before
      # the first irreversible publish.
      - name: Verify site/theme publish metadata
        if: steps.release_mode.outputs.mode != 'stable-exit'
        run: bun scripts/verify-site-publish-metadata.ts

      - name: Publish site and theme packages to npm
        if: steps.release_mode.outputs.mode != 'stable-exit'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          bun run changeset:publish:site

      - name: Deprecate retired alpha-only site package
        if: steps.release_mode.outputs.mode != 'stable-exit'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          npm deprecate '@rizom/site-sections@*' 'This alpha-only package is retired. Migrate to @rizom/site: https://github.com/rizom-ai/brains/blob/main/docs/external-site-authoring.md'
          bun scripts/verify-retired-package-deprecations.ts

      - name: Verify registry and tarball metadata
        if: steps.release_mode.outputs.mode != 'stable-exit'
        run: bun scripts/verify-published-peer-metadata.ts

      # The generic authoring SDK has no Brain runtime dependency and may
      # graduate independently while the runtime remains in prerelease. Keep
      # the workspace on its alpha line so subsequent runtime candidates can
      # still prove compatibility; once a normal release exists, Changesets
      # automatically sends later prereleases to the alpha dist-tag.
      - name: Publish stable generic site SDK
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.stable_sdk_version != '' &&
          steps.release_mode.outputs.mode != 'stable-exit'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          STABLE_SDK_VERSION: ${{ inputs.stable_sdk_version }}
        run: |
          set -euo pipefail
          current="$(bun -e 'console.log((await Bun.file("packages/site/package.json").json()).version)')"
          expected="${current%%-*}"
          if [[ ! "$STABLE_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$STABLE_SDK_VERSION" != "$expected" ]; then
            echo "Stable SDK version must be the non-prerelease base of ${current}; received ${STABLE_SDK_VERSION}." >&2
            exit 1
          fi

          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          published="$(npm view "@rizom/site@${STABLE_SDK_VERSION}" version 2>/dev/null || true)"
          if [ "$published" != "$STABLE_SDK_VERSION" ]; then
            stage="$(mktemp -d)"
            trap 'rm -rf "$stage"' EXIT
            cp -R packages/site/. "$stage/"
            STAGE="$stage" bun -e '
              const path = `${process.env.STAGE}/package.json`;
              const manifest = await Bun.file(path).json();
              manifest.version = process.env.STABLE_SDK_VERSION;
              await Bun.write(path, `${JSON.stringify(manifest, null, 2)}\n`);
            '
            (cd "$stage" && npm publish --access public --tag latest --provenance)
          fi

          for attempt in {1..8}; do
            published="$(npm view "@rizom/site@${STABLE_SDK_VERSION}" version 2>/dev/null || true)"
            latest="$(npm view @rizom/site dist-tags.latest 2>/dev/null || true)"
            license="$(npm view "@rizom/site@${STABLE_SDK_VERSION}" license 2>/dev/null || true)"
            if [ "$published" = "$STABLE_SDK_VERSION" ] && [ "$latest" = "$STABLE_SDK_VERSION" ] && [ "$license" = "Apache-2.0" ]; then
              echo "Verified @rizom/site@${STABLE_SDK_VERSION} as the Apache-2.0 latest release."
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then sleep "$((attempt * 5))"; fi
          done
          echo "Stable @rizom/site registry verification failed." >&2
          exit 1
