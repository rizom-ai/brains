<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared work — visual study</title>
<link rel="stylesheet" href="../rizom-living-memory-page/styles/main.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:0;background-color:var(--color-bg);background-image:var(--bg-noise);color:var(--color-text);font-family:var(--font-body)}h1,h2,p,figure{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}.study{width:min(1250px,100%);margin:auto;padding:24px 36px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--color-border)}.meta{font:10px/1.8 var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted)}.top button{min-height:44px;padding:10px 15px;border:1px solid var(--color-border);background:none;color:var(--color-text);border-radius:3px;font-size:12px}h1{font:450 clamp(34px,4vw,51px)/1.15 var(--font-display);letter-spacing:-.025em;margin:28px 0 30px}h1 em{font-weight:400;color:var(--color-accent)}.work{display:grid;grid-template-columns:205px minmax(0,1fr);gap:38px;align-items:start}.sources>p{margin-bottom:17px}.source{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:14px;min-height:116px;width:100%;padding:14px 0;border:0;border-top:1px solid var(--color-border);background:none;color:var(--color-text);text-align:left}.source:last-of-type{border-bottom:1px solid var(--color-border)}.source svg{display:block;width:72px;height:75px;background:var(--palette-cream);border:1px solid var(--color-border);border-radius:0}.source strong{display:block;font:450 18px/1.2 var(--font-display)}.source small{display:block;font:9px/1.8 var(--font-label);color:var(--color-text-muted);margin-top:8px}.source[aria-pressed=true] strong{color:var(--color-accent)}.source[aria-pressed=true] svg{outline:2px solid var(--color-accent);outline-offset:3px}.sources .instruction{font-size:10px;line-height:1.8;color:var(--color-text-muted);margin-top:18px}.result{background:var(--palette-cream);color:var(--palette-ink);border:1px solid color-mix(in srgb,var(--palette-ink) 25%,transparent);padding:23px 25px 18px}.result-header{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:15px}.result-header h2{font:450 33px/1.2 var(--font-display);letter-spacing:-.025em}.result-header .meta{color:var(--palette-ink);font-size:9px}.map{display:block;width:100%;height:auto;border-block:1px solid color-mix(in srgb,var(--palette-ink) 20%,transparent)}.result-footer{display:flex;justify-content:space-between;gap:25px;align-items:center;padding-top:15px}.result-footer .meta{color:var(--palette-ink);font-size:9px}.key{display:flex;gap:14px;align-items:center}.key span{width:20px;height:3px;background:var(--palette-brass-deep)}.key span:nth-child(2){background:var(--palette-ruby)}.key span:nth-child(3){background:var(--palette-moss-deep)}.key span:nth-child(4){background:var(--palette-ink)}.caption{display:flex;justify-content:space-between;gap:25px;margin-top:24px;border-top:1px solid var(--color-border);padding-top:17px}.caption>p:first-child{font:400 21px/1.4 var(--font-display)}.caption>p:last-child{font-size:11px;line-height:1.7;color:var(--color-text-muted);max-width:45ch}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}.defs{position:absolute;width:0;height:0;overflow:hidden}
.terrain-lines{stroke:var(--palette-ink);stroke-width:.85;stroke-opacity:.3;fill:none}.terrain-main{stroke:var(--palette-brass-deep);stroke-width:1.2;fill:none}.river{stroke:var(--palette-ink);stroke-opacity:.14;stroke-width:17;fill:none}.shore{stroke:var(--palette-ink);stroke-opacity:.25;stroke-width:.8;fill:none}.plot-grid{stroke:var(--palette-ink);stroke-width:.5;stroke-opacity:.09;fill:none}.study-area{fill:var(--palette-brass);fill-opacity:.08;stroke:var(--palette-brass-deep);stroke-width:1.4;stroke-dasharray:5 7}.survey{stroke:var(--palette-ruby);fill:var(--palette-cream);stroke-width:2}.survey-mark{fill:var(--palette-ruby);font:11px var(--font-label)}.route-line{stroke:var(--palette-moss-deep);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.route-outline{stroke:var(--palette-cream);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}.route-stop{fill:var(--palette-cream);stroke:var(--palette-moss-deep);stroke-width:2}.map-label{fill:var(--palette-ink);font:450 22px var(--font-display);letter-spacing:-.4px;paint-order:stroke;stroke:var(--palette-cream);stroke-width:5;stroke-linejoin:round}.map-small{fill:var(--palette-ink);font:10px var(--font-label);letter-spacing:1px;paint-order:stroke;stroke:var(--palette-cream);stroke-width:4}.map-rule{stroke:var(--palette-ink);stroke-width:1;fill:none}.map .layer{transition:opacity .2s}.map[data-focus=area] .layer:not(.area),.map[data-focus=observations] .layer:not(.observations),.map[data-focus=route] .layer:not(.route),.map[data-focus=guide] .layer:not(.guide){opacity:.18}.map .layer{opacity:1}.map[data-focus=area] .study-area{fill-opacity:.2;stroke-width:2.5}.map[data-focus=observations] .survey{stroke-width:3}.map[data-focus=route] .route-line{stroke-width:7}
@media(max-width:900px){.study{padding:20px}.work{grid-template-columns:165px minmax(0,1fr);gap:23px}.source{grid-template-columns:55px 1fr;gap:11px;min-height:100px}.source svg{width:55px;height:63px}.source strong{font-size:17px}.result{padding:20px 18px 15px}.result-header h2{font-size:29px}.result-header .meta{font-size:8px}.sources .instruction{font-size:9px}}
@media(max-width:650px){h1{font-size:36px;max-width:16ch;margin-block:25px}.top .meta{font-size:9px}.top button{font-size:11px}.work{display:flex;flex-direction:column;gap:24px}.sources{width:100%}.sources>p{margin-bottom:12px}.source-list{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.source{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:0;padding:0 0 10px;border-top:0;border-bottom:1px solid var(--color-border)}.source svg{width:100%;height:66px}.source strong{font-size:15px}.source small{font-size:8px;margin-top:4px}.sources .instruction{margin-top:10px;margin-bottom:0;font-size:10px}.result{width:100%;padding:18px 14px 14px}.result-header{display:block;margin-bottom:13px}.result-header h2{font-size:29px}.result-header .meta{margin-top:6px}.result-footer{gap:14px}.result-footer .meta{font-size:8px}.key{gap:8px}.key span{width:12px}.caption{flex-direction:column;gap:13px}.caption>p:first-child{font-size:22px}.caption>p:last-child{max-width:45ch}}
@media(prefers-reduced-motion:reduce){.map .layer{transition:none}}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
  <g id="terrain"><g class="plot-grid"><path d="M0 100H760M0 200H760M0 300H760M0 400H760M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520"/></g><g id="contours" class="terrain-lines"></g><path class="river" d="M-30 413C98 335 126 495 250 418S376 349 470 435S639 468 795 357"/><path class="shore" d="M-30 402C98 324 126 484 250 407S376 338 470 424S639 457 795 346M-30 424C98 346 126 506 250 429S376 360 470 446S639 479 795 368"/></g>
  <g id="area"><path class="study-area" d="M88 142L308 63L583 103L692 285L563 400L297 365L140 402L63 264Z"/><path class="terrain-main" d="M73 134h-13v25M687 273h17v26M304 53v-12h24M298 376v13h-21"/></g>
  <g id="observations"><g class="survey"><circle cx="150" cy="219" r="7"/><circle cx="288" cy="127" r="7"/><circle cx="453" cy="221" r="7"/><circle cx="554" cy="300" r="7"/><circle cx="350" cy="332" r="7"/></g><g class="survey-mark"><text x="164" y="215">01</text><text x="301" y="120">02</text><text x="466" y="214">03</text><text x="567" y="293">04</text><text x="363" y="325">05</text></g></g>
  <g id="route"><path class="route-outline" d="M148 352C180 315 205 306 194 266S160 215 192 189S267 205 295 187S322 137 354 146S391 193 439 185S490 138 534 170S547 230 588 236"/><path class="route-line" d="M148 352C180 315 205 306 194 266S160 215 192 189S267 205 295 187S322 137 354 146S391 193 439 185S490 138 534 170S547 230 588 236"/><circle class="route-stop" cx="148" cy="352" r="6"/><circle class="route-stop" cx="588" cy="236" r="6"/></g>
  <g id="guide"><text x="338" y="99" class="map-label">The ridge</text><text x="442" y="378" class="map-label">Wetland</text><text x="67" y="324" class="map-small">ENTRY</text><path class="map-rule" d="M107 325l28 18"/><text x="585" y="212" class="map-small">LOOKOUT</text><path class="map-rule" d="M604 217l-10 12"/><path class="map-rule" d="M700 73V36l-6 10m6-10 6 10"/><text x="696" y="25" class="map-small">N</text><path class="map-rule" d="M37 473h36M37 467v12M73 467v12"/><text x="88" y="477" class="map-small">ILLUSTRATIVE TERRAIN</text></g>
</defs></svg>
<main class="study">
<header class="top"><p class="meta">Brain · Visual composition</p><button id="theme" type="button" aria-label="Switch to light theme">☀ Light</button></header>
<h1>Different knowledge. <em>Shared work.</em></h1>
<div class="work">
<aside class="sources" aria-label="Four independently owned brains"><p class="meta">Independent brains</p><div class="source-list">
<button class="source" type="button" data-layer="area" aria-pressed="false" aria-controls="shared-map"><svg viewBox="0 0 760 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#terrain"/><use href="#area"/></svg><span><strong>Your brain</strong><small>Project scope</small></span></button>
<button class="source" type="button" data-layer="observations" aria-pressed="false" aria-controls="shared-map"><svg viewBox="90 80 510 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#observations"/></svg><span><strong>Research</strong><small>Field notes</small></span></button>
<button class="source" type="button" data-layer="route" aria-pressed="false" aria-controls="shared-map"><svg viewBox="90 100 560 290" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#route"/></svg><span><strong>Practice</strong><small>Route knowledge</small></span></button>
<button class="source" type="button" data-layer="guide" aria-pressed="false" aria-controls="shared-map"><svg viewBox="300 40 430 370" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#guide"/></svg><span><strong>Publishing</strong><small>Reader guidance</small></span></button>
</div><p class="instruction">Select to trace a contribution.</p></aside>
<figure class="result"><div class="result-header"><h2>A collective field guide</h2><p class="meta">One shared workpiece</p></div>
<svg id="shared-map" class="map" data-focus="all" viewBox="0 0 760 520" role="img" aria-labelledby="map-title map-desc"><title id="map-title">Contributions from four brains combine into a field guide.</title><desc id="map-desc">Project scope, research observations, practical route knowledge, and editorial guidance appear together on one illustrative map. Selecting a source highlights its contribution without changing the others' independently held knowledge. This is invented terrain, not a navigational map or a completed agent result.</desc><use href="#terrain"/><g class="layer area"><use href="#area"/></g><g class="layer observations"><use href="#observations"/></g><g class="layer route"><use href="#route"/></g><g class="layer guide"><use href="#guide"/></g></svg>
<figcaption class="result-footer"><p class="meta" id="focus-label">All contributions</p><div class="key" aria-hidden="true"><span></span><span></span><span></span><span></span></div></figcaption></figure>
</div>
<footer class="caption"><p>Separate knowledge. Collective work.</p><p>Illustrative concept—not a real map, navigation aid, or recorded collaboration.</p></footer>
<p class="sr-only" id="status" role="status" aria-live="polite"></p>
</main>
<script>
const ns='http://www.w3.org/2000/svg',contours=document.getElementById('contours');
for(const [cx,cy,count] of [[375,217,14],[644,436,7]]){for(let level=0;level<count;level++){const rx=29+level*18,ry=20+level*12;let d='';for(let step=0;step<=120;step++){const a=step/120*Math.PI*2,warp=1+.085*Math.sin(a*3+.7)+.04*Math.cos(a*7);const x=cx+Math.cos(a)*rx*warp+Math.sin(a*2)*11,y=cy+Math.sin(a)*ry*warp;d+=(step?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}const path=document.createElementNS(ns,'path');path.setAttribute('d',d+'Z');contours.append(path)}}
const labels={area:'Your brain · project scope',observations:'Research brain · field notes',route:'Practice brain · route knowledge',guide:'Publishing brain · reader guidance'};
let selected='all';const map=document.getElementById('shared-map'),buttons=[...document.querySelectorAll('[data-layer]')];
buttons.forEach(button=>button.addEventListener('click',()=>{selected=selected===button.dataset.layer?'all':button.dataset.layer;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layer===selected)));map.dataset.focus=selected;const label=selected==='all'?'All contributions':labels[selected];document.getElementById('focus-label').textContent=label;document.getElementById('status').textContent=selected==='all'?'All four contributions shown together.':label+' highlighted. Select it again to show all contributions.'}));
const theme=document.getElementById('theme');theme.addEventListener('click',()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';theme.textContent=light?'☾ Dark':'☀ Light';theme.setAttribute('aria-label',`Switch to ${light?'dark':'light'} theme`)});
</script>
</body>
</html>
