<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the network — night sky (study A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,30..100;1,9..144,300..900,30..100&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Study A, the night sky: brains are lights placed by how close their work runs
   to Rizom's. No rings, no spokes. Near lights are large and warm, far lights
   small and cool; every light breathes at its own pace and the whole sky
   drifts. Names are the working-proof layer: mono, lowercase, with the
   cartography glyph. An answer makes the cited lights flare and dims the rest. */
:root {
  --night: #14132b; --night-deep: #0e0d20; --cream: #faf8f3; --brass: #d4af37; --brass-soft: #e8cc6a; --brass-deep: #b08d2a;
  --text: var(--cream); --muted: rgb(250 248 243 / 0.72); --light: rgb(250 248 243 / 0.46); --border: rgb(250 248 243 / 0.14);
  --display: "Fraunces", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --bar: 4.6rem; --words: 36rem; --gap: 4rem;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--night); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
.bar { position: sticky; top: 0; z-index: 5; height: var(--bar); display: flex; align-items: center; gap: 2.2rem; padding: 0 clamp(1rem, 5vw, 5rem); background: rgb(20 19 43 / 0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.wordmark { font-family: var(--display); font-weight: 600; font-size: 1.55rem; font-variation-settings: "SOFT" 70, "opsz" 24; }
.wordmark b { color: var(--brass); }
.bar nav { display: flex; gap: 1.6rem; font-size: 0.98rem; color: var(--light); }
.bar nav a { color: inherit; text-decoration: none; } .bar nav a.is-current { color: var(--text); }
.bar .cta { margin-left: auto; background: var(--brass); color: #1b1a0e; padding: 0.85rem 1.4rem; border-radius: 0.35rem; font-weight: 500; text-decoration: none; }
.story { position: relative; min-height: calc(100svh - var(--bar)); max-width: 80rem; margin: 0 auto; padding: 0 clamp(1rem, 6vw, 7rem) 0 clamp(1rem, 5vw, 5rem); }
.words { max-width: var(--words); min-height: calc(100svh - var(--bar)); display: flex; flex-direction: column; justify-content: center; padding: 4rem 0; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass); margin: 0 0 1.4rem; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 5.4vw, 4.6rem); line-height: 1.02; letter-spacing: -0.01em; margin: 0; font-variation-settings: "SOFT" 70, "opsz" 144; }
.lede { font-family: var(--display); font-size: 1.32rem; line-height: 1.5; color: var(--muted); margin: 1.6rem 0 0; font-variation-settings: "SOFT" 70, "opsz" 24; }
.composer { margin-top: 2.2rem; display: flex; align-items: center; border: 1px solid rgb(from var(--brass) r g b / 0.55); border-radius: 999px; padding: 0.35rem 0.35rem 0.35rem 1.4rem; background: rgb(14 13 32 / 0.7); }
.composer input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 1.05rem; }
.composer button { width: 3rem; height: 3rem; border-radius: 50%; border: 0; background: var(--brass); color: #1b1a0e; font-size: 1.2rem; cursor: pointer; }
.hint { margin: 1rem 0 0; font-size: 0.85rem; color: var(--light); }
.hint button { font: inherit; color: var(--brass); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; }

/* The sky: it holds the screen at the figure's centre line beside the words. */
.sky { position: absolute; top: var(--bar); bottom: 0; left: calc(clamp(1rem, 5vw, 5rem) + var(--words) + var(--gap)); right: clamp(1rem, 6vw, 7rem); pointer-events: none; }
.sky-stage { position: sticky; top: calc(var(--bar) + (100svh - var(--bar)) / 2); height: 0; display: grid; place-items: center; }
.sky-stage > * { grid-area: 1 / 1; translate: 0 -50%; width: min(100%, calc(100svh - var(--bar) - 2rem)); aspect-ratio: 1; }
.sky svg { overflow: visible; }
.drift { transform-origin: 50px 50px; animation: drift 120s ease-in-out infinite alternate; }
@keyframes drift { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }

/* Rizom: the lantern the sky is lit from, a soft breathing wash, no dashes. */
.wash { fill: url(#wash); animation: breathe-wash 9s ease-in-out infinite; transform-origin: 50px 50px; }
@keyframes breathe-wash { 50% { transform: scale(1.08); opacity: 0.85; } }
.lantern { fill: #fff3cf; filter: drop-shadow(0 0 2.4px var(--brass)) drop-shadow(0 0 7px rgb(from var(--brass) r g b / 0.7)); animation: lantern 4.5s ease-in-out infinite; transform-origin: 50px 50px; }
@keyframes lantern { 50% { transform: scale(1.12); } }

/* Kin: brains whose work has drifted together share one faint thread. */
.kin { stroke: var(--brass); stroke-width: 1; stroke-opacity: 0.35; vector-effect: non-scaling-stroke; animation: kin 11s ease-in-out infinite; }
@keyframes kin { 50% { stroke-opacity: 0.12; } }

/* A light: a halo sized by closeness, a core, and its own slow breath. */
.light { transform-box: fill-box; transform-origin: center; transition: opacity 0.7s ease; }
.light .halo { fill: url(#halo); animation: breathe var(--breath, 7s) ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { 50% { transform: scale(1.22); opacity: 0.7; } }
.light .core { fill: var(--cream); stroke: var(--night); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
.light .core--team { fill: none; stroke: var(--cream); stroke-width: 1.1; }
.light .core--org { fill: none; stroke: var(--cream); stroke-width: 1.1; stroke-dasharray: 1 1; }
.float { animation: float var(--float, 14s) ease-in-out var(--phase, 0s) infinite alternate; }
@keyframes float { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 0.5px), var(--dy, -0.6px)); } }

/* Names: the working-proof layer, outward from Rizom, mono and small; they
   ride in the drawing with their lights. */
.name { font-family: var(--mono); font-size: 2.3px; fill: var(--light); letter-spacing: 0.04px; transition: fill 0.6s ease, opacity 0.6s ease; }
.name tspan.g { fill: var(--brass); }

/* An answer: the cited brains flare and the rest withdraw. */
.sky.has-replies .light:not(.is-lit) { opacity: 0.28; }
.sky.has-replies .light.is-lit .name { fill: var(--cream); }
.sky.has-replies .kin:not(.is-lit) { stroke-opacity: 0.08; }
.light.is-lit .halo { animation: flare 2.4s ease-out 1 both, breathe 5s ease-in-out 2.4s infinite; }
@keyframes flare { 0% { transform: scale(0.8); opacity: 1; } 35% { transform: scale(2.2); opacity: 1; } 100% { transform: scale(1.45); opacity: 1; } }
.light.is-lit .core { fill: #fff3cf; filter: drop-shadow(0 0 3px var(--brass)); }
.lead { fill: none; stroke: var(--brass-soft); stroke-width: 0.22; stroke-opacity: 0.8; stroke-dasharray: 1; stroke-dashoffset: 1; animation: lead 1.4s ease-out forwards; filter: drop-shadow(0 0 4px rgb(from var(--brass) r g b / 0.6)); }
@keyframes lead { to { stroke-dashoffset: 0; } }

/* Sightings: now and then one light calls out and Rizom hears it. */
.light.is-sighted .halo { animation: sighting 3s ease-out 1; }
@keyframes sighting { 0% { transform: scale(1); } 25% { transform: scale(1.9); opacity: 1; } 100% { transform: scale(1); } }

.legend { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 1.6rem; justify-content: flex-end; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--light); padding: 0 0 1.4rem; }
.legend b { color: var(--brass); font-weight: 400; margin-right: 0.45em; }

@media (max-width: 60rem) {
  :root { --strip: 34svh; }
  .bar nav { display: none; }
  .story { padding-top: var(--strip); }
  .sky { position: fixed; top: var(--bar); left: 0; right: 0; bottom: auto; height: var(--strip); background: var(--night); border-bottom: 1px solid var(--border); z-index: 4; }
  .sky-stage { position: static; height: 100%; }
  .sky-stage > * { translate: none; width: auto; height: calc(var(--strip) - 1.5rem); }
  .words { min-height: calc(100svh - var(--bar) - var(--strip)); padding: 2.5rem 0 3rem; }
  .name { font-size: 2.9px; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { .drift, .wash, .lantern, .kin, .halo, .float { animation: none !important; } }
</style>
</head>
<body>
<header class="bar"><span class="wordmark">rizom<b>.</b></span><nav><a href="#">Brain</a><a href="#">Work</a><a href="#">Foundation</a><a href="#">Writing</a><a class="is-current" href="#">Ask</a></nav><a class="cta" href="#">Book an audit</a></header>
<main class="story">
  <div class="sky" id="sky" aria-hidden="true">
    <div class="sky-stage">
      <svg viewBox="0 0 100 100" id="svg">
        <defs>
          <radialGradient id="wash"><stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/><stop offset="0.45" stop-color="#d4af37" stop-opacity="0.05"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
          <radialGradient id="halo"><stop offset="0" stop-color="#e8cc6a" stop-opacity="0.55"/><stop offset="0.4" stop-color="#d4af37" stop-opacity="0.18"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="drift" id="drift">
          <circle class="wash" cx="50" cy="50" r="22"/>
          <g id="kin"></g>
          <g id="leads"></g>
          <g id="lights"></g>
          <circle class="lantern" cx="50" cy="50" r="2.1"/>
        </g>
      </svg>
    </div>
    <p class="legend"><span><b>●</b>person</span><span><b>○</b>team</span><span><b>◌</b>organization</span></p>
  </div>
  <section class="words">
    <p class="eyebrow">Ask</p>
    <h1>Ask the network</h1>
    <p class="lede">Put a question to Rizom. It answers from what the connected brains have published, and the brains it drew on light up.</p>
    <form class="composer" onsubmit="return false"><input placeholder="" aria-label="Your question"><button id="send" aria-label="Ask">↑</button></form>
    <p class="hint">Study: <button id="demo">show an answer citing three brains</button> · <button id="reset">reset</button></p>
  </section>
</main>
<script>
// The live map as /ask serves it today: reach from Rizom (0 near, 1 far) and the
// bearing it was placed on, plus the directory's kind for each brain.
const brains = [
  { id: "team.rizom.ai",      name: "rizom core team",             kind: "team",   reach: 0.51, bearing: 200 },
  { id: "docs.rizom.ai",      name: "rizom brain docs",            kind: "team",   reach: 0.56, bearing: 184 },
  { id: "jo.rizom.ai",        name: "jo",                          kind: "person", reach: 0.81, bearing: -10 },
  { id: "sam.rizom.ai",       name: "sam",                         kind: "person", reach: 0.91, bearing: -35 },
  { id: "yeehaa.io",          name: "yeehaa",                      kind: "person", reach: 0.95, bearing: 55 },
  { id: "gg-brain.mindinn.com", name: "green generation foundation", kind: "org",  reach: 0.96, bearing: -28 },
  { id: "becca.rizom.ai",     name: "becca",                       kind: "person", reach: 0.97, bearing: -59 },
  { id: "mindinn.rizom.ai",   name: "mindinn",                     kind: "org",    reach: 0.97, bearing: 186 },
  { id: "natalie.rizom.ai",   name: "natalie",                     kind: "person", reach: 0.98, bearing: -44 },
];
const kin = [["docs.rizom.ai", "team.rizom.ai"]];

// Placement: each brain keeps its reach (how far out it sits) and the order of
// its bearing, but the sky is opened up: bearings are relaxed halfway toward
// an even spread, so one busy sector no longer piles its lights and names.
const sorted = [...brains].sort((a, b) => a.bearing - b.bearing);
const step = 360 / sorted.length;
const placed = sorted.map((b, i) => {
  const even = -90 + i * step + step / 2 - 20;
  const angle = (b.bearing + even) / 2;
  const r = 10 + b.reach * 34;
  const rad = (angle * Math.PI) / 180;
  return { ...b, angle, x: 50 + r * Math.cos(rad), y: 50 + r * Math.sin(rad) };
});
const glyph = { person: "●", team: "∴", org: "◌" };
const svgNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => { const n = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
const lights = document.getElementById("lights"), kinG = document.getElementById("kin");
placed.forEach((b, i) => {
  const near = 1 - b.reach;                 // 0 far … 0.5 near
  const halo = 3.2 + near * 7;              // a near light is a larger, warmer presence
  const core = 0.85 + near * 1.1;
  const g = el("g", { class: "light float", "data-brain": b.id });
  g.style.setProperty("--breath", `${6 + (i % 4) * 1.3}s`);
  g.style.setProperty("--float", `${12 + (i % 5) * 2}s`);
  g.style.setProperty("--phase", `${-(i * 1.7)}s`);
  g.style.setProperty("--dx", `${(i % 2 ? 1 : -1) * 0.5}px`);
  g.style.setProperty("--dy", `${(i % 3 ? -1 : 1) * 0.6}px`);
  g.append(el("circle", { class: "halo", cx: b.x, cy: b.y, r: halo, opacity: 0.55 + near * 0.9 }));
  g.append(el("circle", { class: `core core--${b.kind}`, cx: b.x, cy: b.y, r: core }));
  lights.append(g);
  // The name sits outward of its light; at the drawing's right edge it turns inward so it stays in the frame.
  const side = b.x >= 78 ? "below" : b.x >= 50 ? "right" : "left";
  const t = side === "below"
    ? el("text", { class: "name", x: b.x, y: b.y + halo * 0.55 + 2.6, "text-anchor": "middle" })
    : el("text", { class: "name", x: b.x + (side === "right" ? core + 1.6 : -(core + 1.6)), y: b.y + 0.85, "text-anchor": side === "right" ? "start" : "end" });
  t.textContent = b.name;
  g.append(t);
});
const at = (id) => placed.find((b) => b.id === id);
kin.forEach(([a, b]) => { const p = at(a), q = at(b); kinG.append(el("line", { class: "kin", x1: p.x, y1: p.y, x2: q.x, y2: q.y, "data-kin": `${a} ${b}` })); });

// Sightings: every so often one light calls, Rizom's wash answers.
const sky = document.getElementById("sky");
const sight = () => {
  if (sky.classList.contains("has-replies")) return;
  const g = lights.children[Math.floor(Math.random() * lights.children.length)];
  g.classList.add("is-sighted"); setTimeout(() => g.classList.remove("is-sighted"), 3100);
};
setInterval(sight, 8000);

// An answer: the cited brains light, a lead draws from Rizom to each, the rest withdraw.
const leads = document.getElementById("leads");
const answer = (ids) => {
  sky.classList.add("has-replies"); leads.replaceChildren();
  for (const n of document.querySelectorAll("[data-brain], [data-kin]")) n.classList.toggle("is-lit", ids.some((id) => (n.dataset.brain ?? n.dataset.kin).includes(id)));
  ids.forEach((id, i) => { const b = at(id); const c = { x: (50 + b.x) / 2 + (b.y - 50) * 0.18, y: (50 + b.y) / 2 - (b.x - 50) * 0.18 };
    const p = el("path", { class: "lead", d: `M50 50 Q${c.x} ${c.y} ${b.x} ${b.y}`, pathLength: 1 }); p.style.animationDelay = `${i * 0.25}s`; leads.append(p); });
};
const reset = () => { sky.classList.remove("has-replies"); leads.replaceChildren(); for (const n of document.querySelectorAll(".is-lit")) n.classList.remove("is-lit"); };
document.getElementById("demo").addEventListener("click", () => answer(["docs.rizom.ai", "yeehaa.io", "jo.rizom.ai"]));
document.getElementById("send").addEventListener("click", () => answer(["team.rizom.ai", "mindinn.rizom.ai", "natalie.rizom.ai"]));
document.getElementById("reset").addEventListener("click", reset);
</script>
</body>
</html>
