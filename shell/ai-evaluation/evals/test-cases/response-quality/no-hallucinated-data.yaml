id: shell-no-hallucinated-data
name: No Hallucinated Data
description: Tests that agent doesn't make up content that doesn't exist in the system
type: response_quality
setup:
  permissionLevel: admin
tags:
  - shell
  - quality
  - accuracy
  - hallucination
  - preset-core

turns:
  - userMessage: "Tell me about my blog post on quantum computing"

successCriteria:
  expectedAnyTool:
    - toolNames:
        - system_search
        - system_list
      shouldBeCalled: true
  responseContainsAny:
    - - "couldn't find"
      - "couldn’t find"
      - "could not find"
      - "don't see"
      - "do not see"
      - "no blog post"
      - "not find"
  # Response should NOT contain fabricated details about a non-existent post
  responseNotContains:
    - "your blog post discusses"
    - "your post covers"
    - "you wrote about"
    - "in your article"
    - "the post explains"
    - "published on"

efficiency:
  maxToolCalls: 5
  maxTokens: 30000
