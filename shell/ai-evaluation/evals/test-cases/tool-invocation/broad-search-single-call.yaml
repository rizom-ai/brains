id: shell-broad-search-single-call
name: Broad Search Does Not Fan Out Per Entity Type
description: >-
  Verifies that broad or vague content lookup requests search with scope.kind
  all instead of fanning out into one search per entity type. One retry with a
  lower minScore is the designed answer to matches below the threshold.
type: tool_invocation
setup:
  permissionLevel: admin
tags:
  - shell
  - search
  - efficiency
  - tool-invocation
  - recipe-headless

turns:
  - userMessage: "Search broadly for foo across all entity types in my knowledge base."

successCriteria:
  expectedTools:
    - toolName: system_search
      shouldBeCalled: true
      argsContain:
        query: foo
        scope.kind: all
    - toolName: system_search
      shouldBeCalled: false
      argsContain:
        scope.kind: type

  responseNotContains:
    - "Unknown entity type"
    - "Available types:"
    - "Error:"
    - "failed:"
    - "exception"
    - "stack trace"
    - ".ts:"
    - ".js:"

efficiency:
  maxToolCalls: 2
  maxTokens: 44000
