id: social-media-call-to-action
name: Generate LinkedIn post without stock engagement bait
description: Tests that the LinkedIn template adds no engagement question or call to action of its own; voice and form come from the style guide
type: plugin
tags:
  - social-media
  - linkedin
  - voice
  - quality
plugin: social-media
handler: generation

input:
  prompt: "Write about lessons learned from a failed product launch"
  platform: linkedin

expectedOutput:
  hasFields:
    - content
  fieldValidation:
    - field: content
      minLength: 200
      maxLength: 3000
  contentNotContains:
    - field: content
      patterns:
        - "What's your experience"
        - "Share your thoughts"
        - "[Ll]et me know in the comments"
  qualityCriteria:
    minRelevanceScore: 4
    minAccuracyScore: 4
    minQualityScore: 4
    customCriteria:
      - name: no_engagement_bait
        description: "Content does not end with a generic question or call to action asking readers to comment, share or react"
        minScore: 4
