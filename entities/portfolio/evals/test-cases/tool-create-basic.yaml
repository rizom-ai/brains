id: portfolio-tool-create-basic
name: Portfolio Create Tool Invocation
description: Verifies that the agent starts a portfolio project's generation with system_generate when asked to write its case study
type: tool_invocation
tags:
  - portfolio
  - tool-invocation
  - anti-hallucination

turns:
  - userMessage: "Create a portfolio case study for my API Gateway project from 2024"

successCriteria:
  expectedTools:
    - toolName: system_generate
      shouldBeCalled: true
      argsContain:
        operation.kind: prompt
        operation.entityType: project
    - toolName: system_create
      shouldBeCalled: false
  toolCountRange:
    min: 1
  responseNotContains:
    - "I cannot"
    - "I don't have access"
    - "I'm unable"
  minAccuracyScore: 3

efficiency:
  maxToolCalls: 3
  maxTokens: 30000
