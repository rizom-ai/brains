id: conversation-memory-retrieve-no-name-based-merge
name: Does not merge similarly named actors without canonical links
description: >-
  Two actors share the display name Daniel, but only one has the requested
  canonicalId. Retrieval must not merge by name or prose similarity.
type: plugin
tags:
  - conversation-memory
  - retrieval
  - canonical-identity
  - no-inference
plugin: conversation-memory
handler: retrieveMemory

input:
  query: Daniel onboarding decisions
  interfaceType: discord
  channelId: relay-team
  canonicalId: person:daniel
  memory:
    - id: linked-daniel
      entityType: decision
      conversationId: linked-conv
      interfaceType: discord
      channelId: relay-team
      content: "# Decision\n\nDaniel chose the compact onboarding checklist."
      excerpt: Daniel chose the compact onboarding checklist.
      score: 0.7
      status: active
      updated: "2026-05-04T11:00:00Z"
      # Identities are createExternalActorId(source, subject): Daniel as
      # ("canonical", "person:daniel"), seen in Discord as
      # ("discord", "discord:user-daniel").
      decidedBy:
        - identity:
            kind: external
            externalActorId: ext_f3d6254c34db30bd8cc1244e862d4851c16b92f4aa95a2ced2c83f221f18fe1b
          identityAliases:
            - kind: external
              externalActorId: ext_a607573c22c2ecc1b439889dc8aff9c5b0166b900cebb58f35eda3c229c360be
          displayName: Daniel
    - id: unlinked-daniel
      entityType: decision
      conversationId: unlinked-conv
      interfaceType: discord
      channelId: relay-team
      content: "# Decision\n\nDaniel chose a separate launch checklist."
      excerpt: Daniel chose a separate launch checklist.
      score: 0.99
      status: active
      updated: "2026-05-04T11:01:00Z"
      # Another Daniel, ("discord", "discord:user-other-daniel"), with no canonical link.
      decidedBy:
        - identity:
            kind: external
            externalActorId: ext_cdece56a33e3d342cfade33ddd02696dbe2519cf50e6a325633a873fc1dd6296
          displayName: Daniel

expectedOutput:
  validateEach:
    - path: results[0].id
      equals: linked-daniel
    - path: results[0].spaceId
      equals: discord:relay-team
    - path: results[1]
      exists: false
