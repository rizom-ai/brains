id: channel-decisions-already-recorded
name: Does not record a decision the channel already has
description: >-
  The channel recorded dropping the company field earlier. New messages only
  refer back to it, so the pickup returns no decision.
type: plugin
tags:
  - conversation-memory
  - channel-decisions
plugin: conversation-memory
handler: extractChannelDecisions

input:
  processedThrough: 2
  decisions:
    - title: Drop the company field
      text: The sign-up form no longer asks for a company name.
  messages:
    - speaker: Niels
      userId: usr_niels
      content: Shall we just drop the company field from the sign-up form?
    - speaker: Jo
      userId: usr_jo
      content: Yes, let's drop it.
    - speaker: Natalie
      content: Good call on dropping the company field, by the way.
    - speaker: Jo
      userId: usr_jo
      content: Agreed, glad we decided that.

expectedOutput:
  validateEach:
    - path: count
      equals: 0
